async function imgData(src){
  try{
    let data=src;
    if(!src.startsWith("data:")){
      const r=await fetch(src); if(!r.ok) return null; const b=await r.blob();
      data=await new Promise(res=>{ const f=new FileReader(); f.onload=()=>res(f.result); f.onerror=()=>res(null); f.readAsDataURL(b); });
    }
    if(!data) return null;
    const dim=await new Promise(res=>{ const i=new Image(); i.onload=()=>res({w:i.naturalWidth,h:i.naturalHeight}); i.onerror=()=>res(null); i.src=data; });
    if(!dim) return null;
    return {data,w:dim.w,h:dim.h,fmt:/^data:image\/png/.test(data)?"PNG":"JPEG"};
  }catch(e){ return null; }
}
async function pdfFotos(doc,titulo,urls,cor){
  if(!urls.length) return;
  const imgs=(await Promise.all(urls.map(imgData))).filter(Boolean);
  if(!imgs.length) return;
  const gap=4, w=(CW-2*gap)/3, h=48;
  pdfPrecisa(doc,22+h+gap);
  pdfSecao(doc,titulo,cor,imgs.length+(imgs.length===1?" foto":" fotos"));
  const st=doc._st;
  for(let i=0;i<imgs.length;i+=3){
    pdfPrecisa(doc,h+gap);
    imgs.slice(i,i+3).forEach((im,j)=>{
      const x=ML+j*(w+gap), y=st.y;
      doc.setFillColor(...PC.gnd); doc.roundedRect(x,y,w,h,1.5,1.5,"F");
      const r=Math.min((w-2)/im.w,(h-2)/im.h), iw=im.w*r, ih=im.h*r;
      try{ doc.addImage(im.data,im.fmt,x+(w-iw)/2,y+(h-ih)/2,iw,ih,undefined,"FAST"); }catch(e){}
    });
    st.y+=h+gap;
  }
  st.y+=5;
}
function pdfNovaFolha(doc){ doc.addPage(); doc._drawn.add(doc.internal.getNumberOfPages()); pdfMini(doc,doc._mini); doc._st.y=20; }
/* fotos: todas no mesmo formato, sem rótulos e sem separar por bloco; 4 por folha; sozinha não deixa vaga ao lado */
async function pdfGradeFotos(doc,titulo,cor,linhas){
  const n=linhas.reduce((t,r)=>t+r.length,0); if(!n) return;
  const gap=6, w=(CW-gap)/2, h=112, st=doc._st, POR=2;
  for(let p=0;p<linhas.length;p+=POR){
    pdfNovaFolha(doc);
    if(p===0){ pdfSecao(doc,titulo,cor,n+(n===1?" foto":" fotos")); st.y+=6; }
    for(let k=p;k<Math.min(linhas.length,p+POR);k++){
      const y=st.y;
      for(let j=0;j<linhas[k].length;j++){
        const im=linhas[k][j], x=ML+j*(w+gap);
        doc.setFillColor(...PC.gnd); doc.roundedRect(x,y,w,h,2.4,2.4,"F");
        const r=Math.min(w/im.w,h/im.h), iw=im.w*r, ih=im.h*r;
        try{ doc.addImage(im.data,im.fmt,x+(w-iw)/2,y+(h-ih)/2,iw,ih,undefined,"FAST"); }catch(e){}
      }
      st.y+=h+gap;
    }
  }
}
async function pdfBlocos(doc,f){
  const bl=blocosDe(f).filter(b=>b.a||b.d); if(!bl.length) return;
  const linhas=[]; let pend=null;
  for(const b of bl){
    const ia=b.a?await imgData(b.a):null, id=b.d?await imgData(b.d):null;
    if(!b.proc && ia && id){ if(pend){ linhas.push([pend]); pend=null; } linhas.push([ia,id]); continue; }
    for(const im of [ia,id]){ if(!im) continue; if(pend){ linhas.push([pend,im]); pend=null; } else pend=im; }
  }

function padInit(cv,onInk){
  const x=cv.getContext("2d"); x.lineWidth=4.5; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#26302a"; x.fillStyle="#26302a";
  let des=false, ult=null, tinta=false;
  const pt=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height}; };
  cv.onpointerdown=e=>{ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} des=true; ult=pt(e); x.beginPath(); x.arc(ult.x,ult.y,2.2,0,Math.PI*2); x.fill(); tinta=true; if(onInk) onInk(true); };
  cv.onpointermove=e=>{ if(!des) return; e.preventDefault(); const p=pt(e); x.beginPath(); x.moveTo(ult.x,ult.y); x.lineTo(p.x,p.y); x.stroke(); ult=p; };
  const fim=()=>{ des=false; };
  cv.onpointerup=fim; cv.onpointercancel=fim;
  return { tem:()=>tinta, png:()=>cv.toDataURL("image/png"), limpar:()=>{ x.clearRect(0,0,cv.width,cv.height); tinta=false; if(onInk) onInk(false); } };
}

/* ================= SALVAMENTO AUTOMÁTICO NO SISTEMA (a visita aparece em qualquer aparelho) ================= */
let _asT=null, _asBusy=false, _asLast=0;
function agendaAuto(agora){
  if(!V || V.editando || !V.pdv || !V.started_ts || V._conf) return;
  clearTimeout(_asT);
  const espera = agora ? 800 : (Date.now()-_asLast>60000 ? 600 : 6000);   // pausa na digitação, ou no máximo 1 min sem salvar
  _asT=setTimeout(autoSalvar,espera);
}
function svTxt(){ return V&&V.srv ? "Salvo no sistema" : "Rascunho salvo"; }
function svAtualiza(){ document.querySelectorAll(".sv").forEach(e=>{ if(e.lastChild) e.lastChild.textContent=svTxt(); }); }
async function autoSalvar(){
  if(_asBusy || salvando || !V || V.editando || !V.pdv || !V.started_ts || V._conf || !navigator.onLine) return;
  const vid=V.id; _asBusy=true;
  try{
    const r=await dbGet(TABLE,"select=status,salvo_em&id=eq."+encodeURIComponent(vid)+"&limit=1");
    const s=r[0];
    if(!V || V.id!==vid) return;
    if(s && s.status==="Concluída" && V.status!=="Concluída"){ _asBusy=false; encerradaFora(); return; }
    if(s && V.srv_ts && s.salvo_em!==V.srv_ts){ _asBusy=false; conflitoAuto(s.salvo_em); return; }
    const row=montarRow(false);
    if(row.status!=="Agendada") row.status="Em andamento";
    const falhas=await enviarVisitaRow(row,row.fotos);
    const out=enviarVisitaRow.out;
    if(!V || V.id!==vid) return;
    if(!falhas && out) ["antes","depois","vitrine"].forEach(sl=>{ if(V.fotos[sl].length===row.fotos[sl].length) V.fotos[sl]=out[sl]; });   // fotos já enviadas viram link
    const r2=await dbGet(TABLE,"select=salvo_em&id=eq."+encodeURIComponent(vid)+"&limit=1");
    V.srv=true; V.srv_ts=(r2[0]&&r2[0].salvo_em)||row.salvo_em; _asLast=Date.now();
    kvSet("draft",V); svAtualiza();   // só grava o rascunho local (touch() reagendaria outro envio)
  }catch(e){ /* sem internet ou erro passageiro: tenta de novo na próxima alteração */ }
  finally{ _asBusy=false; }
}
function encerradaFora(){
  clearTimeout(_asT); V=null; kvSet("draft",null);

  openSheet(`${sheetHead("Visita já concluída")}<div class="sb"><p style="margin:0">Esta visita foi concluída em outro aparelho. O rascunho deste aparelho foi removido para não sobrescrever a versão final.</p></div><div class="sf"><button class="btn pri" onclick="closeSheet()">Ok</button></div>`);
}

  if(!V) return; V._conf=true; clearTimeout(_asT); const id=V.id; window._confSrv=srvSalvoEm;
  openSheet(`${sheetHead("Visita alterada em outro aparelho")}<div class="sb"><p style="margin:0">Esta visita foi salva de outro aparelho depois da última vez que este sincronizou. Qual versão você quer usar?</p></div>

  }catch(e){ console.error(e); closeSheet(); toast("Não foi possível gerar o PDF: "+(e.message||e),5000); }
}

/* ---- assinatura do gestor aparece sozinha ---- */
let _pollBusy=false;
async function pollAssin(){
  if(_pollBusy||document.hidden||!navigator.onLine) return;
  let pend; try{ pend=todasVisitas().filter(v=>!v._fila&&v.fotos&&v.fotos.insp&&v.fotos.insp.env_em&&!v.fotos.insp.ass_g); }catch(e){ return; }
  if(!pend.length) return;
  _pollBusy=true;
  try{
    const rows=await dbGet(TABLE,"select=id,fotos&id=in.("+pend.slice(0,30).map(v=>encodeURIComponent(v.id)).join(",")+")");
    const novos=[];
    rows.forEach(r=>{ const I=r.fotos&&r.fotos.insp; if(I&&I.ass_g){ const vv=visitas.find(x=>x.id===r.id); if(vv){ vv.fotos={...(vv.fotos||{}),insp:I}; novos.push(vv); } } });
    if(novos.length){ kvSet("visitas",visitas); novos.forEach(refrescaChk); const v=novos[0]; toast("Checklist assinado por "+((v.fotos.insp.nome_g)||"gestor")+" · "+lojaNome(v.pdv),5000); }
  }catch(e){}
  finally{ _pollBusy=false; }
}
function refrescaChk(v){
  const id=v.id;
  if(CK&&CK.id===id&&typeof renderChk==="function"){ CK.I=inspNorm(v.fotos.insp); CK.v={...CK.v,fotos:v.fotos}; renderChk(); }
  const c=document.getElementById("chkc-"+id); if(c) c.outerHTML=chkCardHTML(v);
  const el=document.querySelector('[data-vck="'+id+'"]'); if(el&&VCK&&VCK.id===id) verChecklist(id,VCK.volta);
  else if(RS&&document.querySelector(".rtabs")) rsAbre();
  if(typeof view!=="undefined"&&view==="painel"&&$("v-painel")) renderPainel();
}
setInterval(pollAssin,8000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) pollAssin(); });
window.addEventListener("focus",pollAssin);
window.addEventListener("online",pollAssin);
/* ================= INVENTÁRIO: METAS, ESTOQUE CHEIO E PRIORIDADE ================= */
let avisos=[], CFG={metas:{}}, avFiltro="abertos", AVN=null;
const NIVEL=[null,"Quase cheio","Cheio","Sem espaço"];
const EXTRA_ID=/^(av|cfg)-/;
function invCarrega(ex){
  avisos=(ex||[]).filter(r=>String(r.id).startsWith("av-")).map(r=>({id:r.id,pdv:r.pdv,data:r.data,hora:r.hora_inicio,por:r.analista,...((r.fotos&&r.fotos.av)||{})}));
  const c=(ex||[]).find(r=>r.id==="cfg-meta"); CFG={metas:(c&&c.fotos&&c.fotos.metas)||{}};
}
function avRow(a){
  const {id,pdv,data,hora,por,...av}=a;
  return {id,pdv,data,hora_inicio:hora||null,hora_fim:null,volumes_estoque:0,volumes_inventario:0,analista:por||"",gestores:"",status:"Aviso",checklist:[],devolvidos:[],descartados:[],vitrine:[],vendidos_fisico:[],notes:[],fotos:{av},salvo_em:new Date().toISOString()};
}
async function avSalvar(a){
  await dbUpsert(TABLE,avRow(a),"id");
  const i=avisos.findIndex(x=>x.id===a.id); if(i>=0) avisos[i]=a; else avisos.unshift(a);
  kvSet("inv",{avisos,CFG});
}
async function cfgSalvar(){
  await dbUpsert(TABLE,{id:"cfg-meta",pdv:"Configuração",data:null,hora_inicio:null,hora_fim:null,volumes_estoque:0,volumes_inventario:0,analista:"",gestores:"",status:"Config",checklist:[],devolvidos:[],descartados:[],vitrine:[],vendidos_fisico:[],notes:[],fotos:{metas:CFG.metas},salvo_em:new Date().toISOString()},"id");
  kvSet("inv",{avisos,CFG});
}

/* ---- situação de cada aviso ---- */
function avInfo(a){
  const f=filialDe(a.pdv), apoio=a.apoio||[];
  const vis=todasVisitas().filter(v=>filialDe(v.pdv)===f&&v.status!=="Agendada"&&v.data&&v.data>=a.data).sort((x,y)=>x.data.localeCompare(y.data))[0];
  if(vis) return {st:"visitado",fim:vis.data,dias:Math.max(0,diffDias(a.data,vis.data))};
  if(a.resolvido_em){ const fim=a.resolvido_em.slice(0,10); return {st:"resolvido",fim,dias:Math.max(0,diffDias(a.data,fim))}; }
  const ult=apoio.length?apoio[apoio.length-1].em.slice(0,10):a.data;
  return {st:apoio.length?"acompanhamento":"aberto",espera:Math.max(0,diffDias(a.data,hoje())),parado:diffDias(ult,hoje())>=7};
}
const avPendente=x=>x.i.st==="aberto"||x.i.st==="acompanhamento";
function avLista(){ return avisos.map(a=>({a,i:avInfo(a)})); }
function diasTxt(n){ return n===0?"hoje":n===1?"há 1 dia":"há "+n+" dias"; }

/* ---- prioridade de visita ---- */
function prioridades(){
  const ult=ultimaVisitaPorFilial(), garg=gargalosAbertos(), av=avLista().filter(avPendente);
  return pdvs.map(p=>{
    let pts=0; const mot=[]; const u=ult[p.filial], dias=u?diffDias(u.data,hoje()):null;
    const aa=av.filter(x=>filialDe(x.a.pdv)===p.filial);
    if(aa.length){
      const esp=Math.max(...aa.map(x=>x.i.espera));
      pts+=50+10*(aa.length-1)+Math.min(20,esp*2);
      mot.push(["f","Estoque cheio "+diasTxt(esp)+(aa.length>1?" · "+aa.length+" avisos":"")]);
      const ap=aa.flatMap(x=>x.a.apoio||[]).map(x=>x.em.slice(0,10)).sort();
      if(ap.length){ const d=diffDias(ap[ap.length-1],hoje()); if(d<7){ pts-=20; mot.push(["g","Apoio online "+diasTxt(d)]); } }
    }
    pts+= dias==null?40:Math.min(40,Math.floor(dias/3));
    mot.push(["d",dias==null?"Nunca visitada":dias+" dias sem visita"]);
    const g=garg.filter(x=>filialDe(x.v.pdv)===p.filial).length;
    if(g){ pts+=Math.min(30,15*g); mot.push(["g",g+(g>1?" gargalos abertos":" gargalo aberto")]); }
    return {p,pts:Math.max(0,pts),mot,aviso:aa.length>0};
  }).sort((a,b)=>b.pts-a.pts);
}
const nivPri=p=>p>=70?["al","alta"]:p>=40?["me","média"]:["ba","baixa"];

/* ---- metas ---- */
function metaEfetiva(ym){
  const m=(CFG.metas||{})[ym]; if(!m) return null;
  const an=m.an||{}, soma=Object.values(an).reduce((s,n)=>s+(Number(n)||0),0);
  const geral=Number(m.geral)||soma||0; if(!geral) return null;
  return {geral,an};
}
function metaSheet(y,m){
  const ym=`${y}-${pad(m+1)}`, cur=(CFG.metas||{})[ym]||{}, an=cur.an||{};
  const ant=Object.keys(CFG.metas||{}).filter(k=>k<ym).sort().pop();
  openSheet(`${sheetHead("Meta de "+MESES[m]+" "+y)}<div class="sb">
    ${ant&&!cur.geral&&!Object.keys(an).length?`<button type="button" class="btn sm" style="margin-bottom:12px" onclick="metaCopia('${ant}')">Copiar a meta do mês anterior</button>`:""}
    <div class="fld"><label>Meta de visitas do mês</label><input class="in" id="mt-g" type="number" inputmode="numeric" min="0" placeholder="Ex.: número de visitas" value="${cur.geral||""}"></div>
    <div class="fld"><label>Meta por analista <span class="mut" style="font-weight:400">(opcional)</span></label>
      ${listaAnalistas().map(a=>`<div class="gvr"><span>${esc(a)}</span><input class="in" style="width:92px;text-align:center" type="number" inputmode="numeric" min="0" data-an="${esc(a)}" value="${an[a]||""}"></div>`).join("")}
      <p class="mut" style="font-size:12.5px;margin:8px 0 0">Se não preencher a meta geral, ela passa a ser a soma das metas dos analistas.</p></div></div>
    <div class="sf">${cur.geral||Object.keys(an).length?`<button class="btn red" onclick="metaSalvar('${ym}',true)">Remover meta</button>`:`<button class="btn" onclick="closeSheet()">Cancelar</button>`}<button class="btn pri" onclick="metaSalvar('${ym}')">Salvar meta</button></div>`,true);
}
function metaCopia(k){ const m=CFG.metas[k]||{}; $("mt-g").value=m.geral||""; document.querySelectorAll("[data-an]").forEach(i=>{ i.value=(m.an&&m.an[i.dataset.an])||""; }); }
async function metaSalvar(ym,remover){
  const g=parseInt($("mt-g").value,10)||0, an={};
  document.querySelectorAll("[data-an]").forEach(i=>{ const n=parseInt(i.value,10)||0; if(n>0) an[i.dataset.an]=n; });
  if(!navigator.onLine){ toast("Sem internet. Conecte para salvar a meta.",4000); return; }
  const antes=JSON.stringify(CFG.metas);
  if(remover||(!g&&!Object.keys(an).length)) delete CFG.metas[ym]; else CFG.metas[ym]={geral:g||null,an};
  try{ await cfgSalvar(); closeSheet(); renderAtual(); toast(remover?"Meta removida":"Meta salva"); }
  catch(e){ CFG.metas=JSON.parse(antes); toast("Não foi possível salvar a meta agora.",4000); }
}

/* ---- tela Estoque cheio ---- */
function renderEstoque(){
  const lista=avLista().sort((x,y)=>String(y.a.data).localeCompare(String(x.a.data))||String(y.a.criado_em||"").localeCompare(String(x.a.criado_em||"")));
  const ab=lista.filter(avPendente), res=lista.filter(x=>!avPendente(x)), acomp=ab.filter(x=>x.i.st==="acompanhamento");
  const tm=res.length?res.reduce((s,x)=>s+x.i.dias,0)/res.length:null;
  const mostrar=avFiltro==="abertos"?ab:avFiltro==="resolvidos"?res:lista;
  const st=(n,l,s)=>`<div class="est"><b>${n}</b><span>${l}</span>${s?`<small>${s}</small>`:""}</div>`;
  $("v-estoque").innerHTML=`<div class="ph"><div><h1>Estoque cheio</h1><div class="sub">Lojas que avisaram que o estoque está cheio</div></div>
    <div class="acts"><button class="btn pri" onclick="avNovo()">+ Registrar aviso</button></div></div>
    <div class="ests">${st(ab.length,"Abertos","")}${st(acomp.length,"Com apoio online","")}${st(res.length,"Resolvidos","")}${st(tm==null?"-":fmt1(tm),"Dias até resolver","média")}</div>
    <div class="rtabs" style="margin-top:14px">${[["abertos","Abertos ("+ab.length+")"],["resolvidos","Resolvidos ("+res.length+")"],["todos","Todos ("+lista.length+")"]].map(([k,n])=>`<button type="button" class="${avFiltro===k?"on":""}" onclick="avFiltro='${k}';renderEstoque()">${n}</button>`).join("")}</div>
    ${mostrar.length?mostrar.map(avCard).join(""):`<div class="card"><div class="empty">${avFiltro==="abertos"?"Nenhum aviso aberto. Quando uma loja avisar, registre aqui.":"Nada por aqui ainda."}</div></div>`}`;
}
function avCard(x){
  const a=x.a, i=x.i, ap=a.apoio||[];
  const chip = i.st==="visitado"?`<span class="mtag ok">Visitada em ${fmtData(i.fim)} · ${i.dias} ${i.dias===1?"dia":"dias"}</span>`
    : i.st==="resolvido"?`<span class="mtag ok">Resolvido em ${fmtData(i.fim)} · ${i.dias} ${i.dias===1?"dia":"dias"}</span>`
    : i.st==="acompanhamento"?`<span class="mtag info">Com apoio online</span>${i.parado?`<span class="mtag warn">Sem retorno há 7 dias ou mais</span>`:""}`
    : `<span class="mtag ${i.parado?"bad":"warn"}">${i.parado?"Parado "+diasTxt(i.espera):"Aberto "+diasTxt(i.espera)}</span>`;
  return `<div class="card avc"><div class="avh"><div class="tx"><b>${esc(lojaNome(a.pdv))}</b><span>Avisou em ${fmtData(a.data)}${a.canal?" · "+esc(a.canal):""}${a.quem?" · "+esc(a.quem):""}</span></div><span class="nvl n${a.nivel||2}">${NIVEL[a.nivel||2]}</span></div>
    ${a.obs?`<p class="avo">${esc(a.obs)}</p>`:""}
    <div class="avs">${chip}</div>
    ${ap.length?`<div class="apol"><h4>Apoio online</h4>${ap.map(p=>`<div class="apo"><b>${dhBR(p.em)}${p.por?" · "+esc(p.por):""}</b><p>${esc(p.txt)}</p></div>`).join("")}</div>`:""}
    ${i.st==="resolvido"&&a.resolvido_txt?`<p class="avo"><b>Como foi resolvido:</b> ${esc(a.resolvido_txt)}</p>`:""}
    <div class="avb">${avPendente(x)?`<button class="btn sm pri" onclick="avApoio('${a.id}')">Registrar apoio online</button><button class="btn sm" onclick="avResolver('${a.id}')">Marcar como resolvido</button>`:(i.st==="resolvido"?`<button class="btn sm" onclick="avReabrir('${a.id}')">Reabrir</button>`:"")}<button class="btn sm red" onclick="avExcluir('${a.id}')">Excluir</button></div></div>`;
}
function avNovo(){
  AVN={pdv:"",nivel:2,canal:"WhatsApp"};
  openSheet(`${sheetHead("Registrar aviso: estoque cheio")}<div class="sb">
    <div class="fld"><label>Loja que avisou</label><div id="av-sel" class="mut" style="margin-bottom:6px">Nenhuma loja escolhida</div><input class="in" id="av-q" placeholder="Buscar por nome ou número" autocomplete="off"><div class="pl" id="av-l" style="max-height:170px;overflow:auto;margin-top:6px"></div></div>
    <div class="fld"><label>Quão cheio está</label><div class="segb" id="av-n">${[1,2,3].map(n=>`<button type="button" class="${AVN.nivel===n?"on":""}" onclick="avSet('nivel',${n})">${NIVEL[n]}</button>`).join("")}</div></div>
    <div class="f2"><div class="fld"><label>Como avisou</label><select class="in" onchange="AVN.canal=this.value"><option>WhatsApp</option><option>Ligação</option><option>Outro</option></select></div>
    <div class="fld"><label>Data do aviso</label><input class="in" type="date" id="av-d" value="${hoje()}"></div></div>
    <div class="fld"><label>Quem avisou</label><input class="in" id="av-w" placeholder="Nome de quem avisou"></div>
    <div class="fld"><label>O que a loja informou</label><textarea class="in" id="av-o" rows="2" placeholder="Ex.: caixas no corredor, sem espaço para a reposição"></textarea></div>
    <div class="fld"><label>Apoio online já dado <span class="mut" style="font-weight:400">(opcional)</span></label><textarea class="in" id="av-a" rows="2" placeholder="O que foi orientado ou feito para melhorar o estoque por enquanto"></textarea></div></div>
    <div class="sf"><button class="btn" onclick="closeSheet()">Cancelar</button><button class="btn pri" id="av-ok" onclick="avGravar()">Salvar aviso</button></div>`,true);
  const render=q=>{ q=(q||"").toLowerCase(); $("av-l").innerHTML=pdvs.filter(p=>!q||(p.nome+" "+p.filial).toLowerCase().includes(q)).slice(0,40).map(p=>`<button type="button" onclick="avLoja('${esc(p.filial)}')"><div class="tx"><b>${esc(p.nome)}</b><span>Filial ${esc(p.filial)}</span></div></button>`).join("")||`<div class="empty">Nenhuma loja encontrada.</div>`; };
  render(""); $("av-q").oninput=e=>render(e.target.value);
}
function avSet(k,v){ AVN[k]=v; document.querySelectorAll("#av-n button").forEach((b,i)=>b.classList.toggle("on",i+1===v)); }
function avLoja(f){ const p=pdvs.find(x=>x.filial===f); if(!p) return; AVN.pdv=p.label; $("av-sel").innerHTML=`<b style="color:var(--ink)">${esc(p.nome)}</b> <span class="mut">· filial ${esc(p.filial)}</span>`; }
async function avGravar(){
  if(!AVN.pdv){ toast("Escolha a loja que avisou."); return; }
  if(!navigator.onLine){ toast("Sem internet. Conecte para salvar o aviso.",4000); return; }
  const por=ls.get("vx_analista",""), agora=new Date(), txt=($("av-a").value||"").trim();
  const a={id:"av-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),pdv:AVN.pdv,data:$("av-d").value||hoje(),hora:pad(agora.getHours())+":"+pad(agora.getMinutes()),por,criado_em:agora.toISOString(),nivel:AVN.nivel,canal:AVN.canal,quem:($("av-w").value||"").trim(),obs:($("av-o").value||"").trim(),apoio:txt?[{em:agora.toISOString(),por,txt}]:[],resolvido_em:null};
  $("av-ok").disabled=true;
  try{ await avSalvar(a); closeSheet(); renderAtual(); toast("Aviso registrado"); }
  catch(e){ $("av-ok").disabled=false; toast("Não foi possível salvar o aviso agora.",4000); }
}
function avApoio(id){
  const a=avisos.find(x=>x.id===id); if(!a) return;
  openSheet(`${sheetHead("Apoio online")}<div class="sb"><p class="mut" style="margin:0 0 10px;font-size:14px"><b style="color:var(--ink)">${esc(lojaNome(a.pdv))}</b></p>
    <div class="fld"><label>O que foi orientado ou feito para melhorar o estoque por enquanto</label><textarea class="in" id="ap-t" rows="4" placeholder="Ex.: orientei separar o excesso por categoria e liberar o corredor"></textarea></div></div>
    <div class="sf"><button class="btn" onclick="closeSheet()">Cancelar</button><button class="btn pri" id="ap-ok" onclick="avApoioOk('${id}')">Salvar apoio</button></div>`,true);
}
async function avApoioOk(id){
  const a=avisos.find(x=>x.id===id), txt=($("ap-t").value||"").trim(); if(!a) return;
  if(!txt){ toast("Escreva o que foi feito."); return; }
  if(!navigator.onLine){ toast("Sem internet. Conecte para salvar.",4000); return; }
  $("ap-ok").disabled=true;
  try{ await avSalvar({...a,apoio:[...(a.apoio||[]),{em:new Date().toISOString(),por:ls.get("vx_analista",""),txt}]}); closeSheet(); renderAtual(); toast("Apoio registrado"); }
  catch(e){ $("ap-ok").disabled=false; toast("Não foi possível salvar agora.",4000); }
}
function avResolver(id){
  const a=avisos.find(x=>x.id===id); if(!a) return;
  openSheet(`${sheetHead("Marcar como resolvido")}<div class="sb"><p class="mut" style="margin:0 0 10px;font-size:14px"><b style="color:var(--ink)">${esc(lojaNome(a.pdv))}</b></p>
    <div class="fld"><label>Como foi resolvido <span class="mut" style="font-weight:400">(opcional)</span></label><textarea class="in" id="rs-t" rows="3" placeholder="Ex.: loja liberou o espaço seguindo a orientação"></textarea></div></div>
    <div class="sf"><button class="btn" onclick="closeSheet()">Cancelar</button><button class="btn pri" id="rs-ok" onclick="avResolverOk('${id}')">Marcar como resolvido</button></div>`,true);
}
async function avResolverOk(id){
  const a=avisos.find(x=>x.id===id); if(!a) return;
  if(!navigator.onLine){ toast("Sem internet. Conecte para salvar.",4000); return; }
  $("rs-ok").disabled=true;
  try{ await avSalvar({...a,resolvido_em:new Date().toISOString(),resolvido_txt:($("rs-t").value||"").trim()}); closeSheet(); renderAtual(); toast("Aviso resolvido"); }
  catch(e){ $("rs-ok").disabled=false; toast("Não foi possível salvar agora.",4000); }
}
async function avReabrir(id){
  const a=avisos.find(x=>x.id===id); if(!a) return;
  try{ await avSalvar({...a,resolvido_em:null,resolvido_txt:""}); renderAtual(); toast("Aviso reaberto"); }catch(e){ toast("Não foi possível reabrir agora.",4000); }
}
async function avExcluir(id){
  if(!confirm("Excluir este aviso? Não dá para desfazer.")) return;
  try{ await dbDelete(TABLE,"id=eq."+encodeURIComponent(id)); avisos=avisos.filter(x=>x.id!==id); kvSet("inv",{avisos,CFG}); renderAtual(); toast("Aviso excluído"); }
  catch(e){ toast(ehRede(e)?"Sem internet para excluir agora.":"Erro: "+e.message); }
}
