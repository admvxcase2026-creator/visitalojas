<style>
:root{
  --ink:#1c2733; --bar:#17324d; --sage:#1f6f9a; --sage-d:#185a7e; --sage-l:#e3eef6; --ok:#2f8a5b; --ok-l:#dff1e7; --ground:#eef1f4; --card:#fff; --line:#d9dfe5; --mut:#667381;
  --desc:#c4473f; --desc-l:#f7e1de; --vit:#c98a1b; --vit-l:#f6e8c8; --fis:#3876aa; --fis-l:#dce9f4; --dev:#5f9a58;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --serif:Charter,"Iowan Old Style","Source Serif 4",Georgia,"Times New Roman",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font-size:16px}
h1,h2,h3{margin:0;font-weight:600}
.serif{font-family:var(--serif)}
.mut{color:var(--mut)}
.hide{display:none!important}
svg{display:block}
/* barra superior */
.top{position:sticky;top:0;z-index:30;background:var(--bar);color:#fff;padding:var(--sat) 28px 0;}
.top-in{height:58px;display:flex;align-items:center;gap:22px;max-width:1240px;margin:0 auto}
.brand{font-weight:700;letter-spacing:.16em;font-size:17px}
.brand b{color:#7db4d6}
.brand-sub{color:#d4e3ef;font-size:15px;font-weight:600;padding-left:20px;border-left:1px solid #4a6178}
.nav{display:flex;gap:4px;margin-left:10px;align-self:stretch}
.nav button{position:relative;display:flex;align-items:center;gap:8px;color:#b9cbdb;padding:0 16px;border-radius:0;font-weight:600;font-size:15px;letter-spacing:.01em}
.nav button.on{color:#fff}.nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#7db4d6}
.nbd{min-width:20px;height:20px;border-radius:99px;background:#e0675f;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.nav button:hover{color:#fff}
.top-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:#3a403b;border-radius:99px;padding:7px 14px;font-size:13px;color:#e4e8e2;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:#87b87f;display:block}
.pill.off i{background:#e0867f}
.pill.warn{background:#6a5320;color:#ffe9b0}
.pill.warn i{background:#f0b94a}
main{max-width:1240px;margin:0 auto;padding:26px 28px 60px}
.view{display:none}
.view.on{display:block}
/* títulos */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.1}
.ph .sub{color:var(--mut);font-size:14px;margin-top:4px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.pri:hover{background:var(--sage-d)}
.btn.dk{background:var(--bar);border-color:var(--bar);color:#fff}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:9px}
.btn.red{color:var(--desc);border-color:#e6bfba}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.blk{width:100%}
.ibtn{width:44px;height:44px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line)}
/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h2{font-size:16px}
.card .hsub{font-size:13px;color:var(--mut);font-weight:400;margin-left:8px}
.grid{display:grid;gap:16px}
.g-top{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:16px}
.g-bot{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1fr);margin-top:16px}
/* cobertura */
.cov{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid b{font-family:var(--serif);font-size:38px;line-height:1}
.ring .mid span{font-size:12px;color:var(--mut)}
.cov-t{flex:1;min-width:230px}
.cov-t .lab{font-size:14px;font-weight:600;color:var(--mut)}
.cov-t .big{font-family:var(--serif);font-size:46px;font-weight:700;line-height:1.1;margin:2px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;background:#ebeae4;color:#555b52}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.amb{background:var(--vit-l);color:#8a5d06}
.chip.grn{background:var(--ok-l);color:#1f6b43}
.chip.red{background:var(--desc-l);color:#a2362f}
.cov-t p{margin:0;font-size:14px;color:#454c43}
.mapt{margin:22px 0 10px;font-weight:600;font-size:14px}
.map{display:flex;flex-wrap:wrap;gap:6px}
.map button{width:26px;height:26px;border-radius:7px;background:#ccc;transition:transform .1s}
.map button:active{transform:scale(.85)}
.c-v{background:#5f9a58!important}.c-r{background:#a9cfa3!important}.c-a{background:#e3b65a!important}.c-x{background:#d9726a!important}.c-n{background:#d3d2cb!important}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}
/* listas */
.lst{margin:12px -20px -20px}
.li{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid #eeede7}
.li .dot{width:11px;height:11px;border-radius:3px;flex:none}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;font-size:15px;line-height:1.25}
.li .tx span{font-size:13px;color:var(--mut)}
.more{display:block;width:100%;text-align:center;padding:13px;border-top:1px solid #eeede7;color:var(--sage-d);font-weight:600;font-size:14px}
.empty{padding:22px 0 8px;color:var(--mut);font-size:14px;text-align:center}
/* kpis */
.kpi{padding:18px 20px}
.kpi .k{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mut)}
.kpi .k i{width:9px;height:9px;border-radius:3px;display:block}
.kpi .n{font-family:var(--serif);font-size:34px;font-weight:700;margin:8px 0 2px}
.kpi .n small{font-size:18px;font-weight:600}
.kpi .s{font-size:13px;color:var(--mut)}
/* barras */
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;margin-top:14px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bars .b{width:100%;max-width:64px;background:var(--sage);border-radius:7px 7px 0 0;min-height:3px}
.bars span{font-size:12px;color:var(--mut)}.bars b{font-size:14px}
.rk{display:grid;grid-template-columns:minmax(0,150px) 1fr 34px;gap:12px;align-items:center;margin-top:13px;font-size:14px}
.rk .nm{line-height:1.25}
.rk .tr{height:8px;border-radius:9px;background:#ebeae4;overflow:hidden}
.rk .tr i{display:block;height:100%;background:var(--desc);border-radius:9px}
.rk b{text-align:right}
.gg{padding:13px 20px;border-top:1px solid #eeede7;display:flex;gap:12px;align-items:flex-start}
.gg .tx{flex:1;min-width:0}
.gg .tx b{font-weight:600;display:block;font-size:14.5px;word-break:break-word}
.gg .tx span{font-size:12.5px;color:var(--mut)}
.tag{display:inline-block;border-radius:99px;font-size:12px;font-weight:700;padding:3px 10px;background:#ebeae4;color:#555b52;margin-bottom:5px}
.tag.gargalo{background:var(--desc-l);color:#a2362f}.tag.duvida{background:var(--vit-l);color:#8a5d06}.tag.obs{background:var(--fis-l);color:#2a5f8a}.tag.conversa{background:var(--ok-l);color:#1f6b43}
/* banners */
.banner{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--vit);border-radius:12px;padding:14px 16px;margin-bottom:16px;flex-wrap:wrap}
.banner .tx{flex:1;min-width:200px;font-size:14px}
.banner .tx b{display:block;font-size:15px}
.banner.ok{border-left-color:var(--ok)}
/* histórico */
.fil{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fil>*{min-height:44px}
.in{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;appearance:none;-webkit-appearance:none}
textarea.in{padding:12px 14px;min-height:88px;resize:vertical}

<script>
/* ================= CONFIG SUPABASE (REST, sem biblioteca) ================= */
const SUPABASE_URL = "https://fevhyllvfhvzzfhwyjuk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZldmh5bGx2Zmh2enpmaHd5anVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NzEyMTcsImV4cCI6MjA5NDQ0NzIxN30.GJRgEKW1bVWX1957_bKCTO6aVmR_rXWRCmo9-ZJDPiE";
const TABLE  = "visitas_organizacao_estoque";
const BUCKET = "visitas-estoque";
const REST   = SUPABASE_URL + "/rest/v1/";
const HDR    = { apikey: SUPABASE_KEY, Authorization: "Bearer "+SUPABASE_KEY };
/* Leitor de código de barras pela câmera. Para tirar do app, troque para false. */
const ENABLE_CAMERA_SCAN = false;   // leitor por câmera desativado: o cadastro não tem código de barras

async function httpErr(r){ return new Error("HTTP "+r.status+" "+(await r.text()).slice(0,200)); }
async function dbGet(tabela, query, extra){
  const r = await fetch(REST+tabela+"?"+query, { headers: {...HDR, ...(extra||{})} });
  if(!r.ok) throw await httpErr(r);
  return r.json();
}
async function dbGetAll(tabela, query){
  const out=[]; const PG=1000;
  for(let off=0; off<200000; off+=PG){
    const rows = await dbGet(tabela, query, {Range:`${off}-${off+PG-1}`, "Range-Unit":"items"});
    out.push(...rows);
    if(rows.length<PG) break;
  }
  return out;
}
async function dbUpsert(tabela, row, onConflict){
  const r = await fetch(REST+tabela+"?on_conflict="+onConflict, {
    method:"POST",
    headers:{...HDR, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=minimal"},
    body: JSON.stringify(row)
  });
  if(!r.ok) throw await httpErr(r);
}
async function dbPatch(tabela, filtro, obj){
  const r = await fetch(REST+tabela+"?"+filtro, {
    method:"PATCH",
    headers:{...HDR, "Content-Type":"application/json", Prefer:"return=minimal"},
    body: JSON.stringify(obj)
  });
  if(!r.ok) throw await httpErr(r);
}
async function dbDelete(tabela, filtro){
  const r = await fetch(REST+tabela+"?"+filtro, { method:"DELETE", headers: HDR });
  if(!r.ok) throw await httpErr(r);
}
async function storageUpload(path, blob){
  const r = await fetch(SUPABASE_URL+"/storage/v1/object/"+BUCKET+"/"+path, {
    method:"POST", headers:{...HDR, "Content-Type":"image/jpeg", "x-upsert":"true"}, body: blob
  });
  if(!r.ok) throw await httpErr(r);
  return SUPABASE_URL+"/storage/v1/object/public/"+BUCKET+"/"+path;
}
const ehRede = e => e instanceof TypeError || /Failed to fetch|NetworkError|Load failed|network/i.test(e&&e.message||"") || !navigator.onLine;

/* ================= ARMAZENAMENTO LOCAL (rascunho, cache, fila) ================= */
const _mem = {};
let _db = null;
function idb(){
  if(_db) return _db;
  _db = new Promise((res,rej)=>{
    try{
      const q = indexedDB.open("vx-visitas",1);
      q.onupgradeneeded = ()=>q.result.createObjectStore("kv");
      q.onsuccess = ()=>res(q.result);
      q.onerror = ()=>rej(q.error);
    }catch(e){ rej(e); }
  });
  return _db;
}
async function kvGet(k){
  try{
    const db = await idb();
    return await new Promise((res,rej)=>{ const r=db.transaction("kv").objectStore("kv").get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  }catch(e){ return _mem[k]; }
}
async function kvSet(k,v){
  _mem[k]=v;
  try{
    const db = await idb();
    await new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite"); if(v===undefined||v===null) t.objectStore("kv").delete(k); else t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); });
  }catch(e){ /* sem armazenamento: segue só em memória */ }
}
const ls = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ================= UTILIDADES ================= */
const esc = s => (s??"").toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoje = () => ymd(new Date());
const horaAgora = () => { const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const fmtData = d => { if(!d) return "-"; const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; };
const fmtDM = d => { if(!d) return "-"; const [,m,dd]=d.split("-"); return `${dd}/${m}`; };
const dUTC = s => { const [y,m,d]=s.split("-").map(Number); return Date.UTC(y,m-1,d); };
const diffDias = (a,b) => Math.round((dUTC(b)-dUTC(a))/864e5);
const fmt1 = n => (Math.round(n*10)/10).toFixed(1).replace(".",",");
const nIt = n => n+(n===1?" item":" itens");
const fmtN = n => (n||0).toLocaleString("pt-BR");
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
let toastT;
function toast(msg,ms){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),ms||2600); }
function vib(ms){ try{ navigator.vibrate&&navigator.vibrate(ms||10); }catch(e){} }
const $ = id => document.getElementById(id);

/* Feriados: nacionais + Bahia (2 de julho) + Salvador (8 de dezembro) */
function pascoa(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(y,mes-1,dia);
}
const _fer = {};
function feriados(y){
  if(_fer[y]) return _fer[y];
  const s=new Set(["01-01","04-21","05-01","07-02","09-07","10-12","11-02","11-15","11-20","12-08","12-25"].map(x=>y+"-"+x));
  const p=pascoa(y), add=n=>{ const d=new Date(p); d.setDate(d.getDate()+n); return ymd(d); };
  [-48,-47,-2,60].forEach(n=>s.add(add(n)));
  return _fer[y]=s;
}
function ehUtil(d){ const w=d.getDay(); return w!==0 && w!==6 && !feriados(d.getFullYear()).has(ymd(d)); }
function diasUteis(ini, fim){ // inclusivo
  let n=0; const d=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate());
  fim=new Date(fim.getFullYear(),fim.getMonth(),fim.getDate());
  while(d<=fim){ if(ehUtil(d)) n++; d.setDate(d.getDate()+1); }
  return n;
}

/* ================= CATÁLOGOS E DADOS ================= */
const CHECK_ITENS = ["Organizar estoque","Retirar excesso","Descartar itens antigos","Conferência de vitrine"];
const MOTIVOS = ["Vencido","Avariado","Obsoleto","Sem giro","Outro"];
const MOTIVOS_VIT = ["Obsoleto","Avariado","Arranhado","Capa amarelada","Outro"];
const ANALISTAS = ["Amanda Menezes","Suiane Lopes","Raquel França","Felipe Santana"];
const TIPO_LABEL = {conversa:"Conversa com gestor",duvida:"Dúvida",gargalo:"Gargalo",obs:"Observação"};
const LISTAS = {
  dev:   {campo:"devolvidos",     nome:"Devolvidos",              cor:"#5f9a58", motivos:null},
  desc:  {campo:"descartados",    nome:"Descartados",             cor:"#c4473f", motivos:MOTIVOS},
  vit:   {campo:"vitrine",        nome:"Vitrine retirada",        cor:"#c98a1b", motivos:MOTIVOS_VIT, barras:true},
  venfis:{campo:"vendidos_fisico",nome:"Vendidos, ainda na loja", cor:"#3876aa", motivos:null, barras:true}
};
let pdvs = [];          // {filial, nome, label}
let visitas = [];       // vindas do banco
let fila = [];          // visitas aguardando envio {row, fotos}
const cacheProd = {};   // codigo -> descricao | null
let online = true;

function setConn(txt, ok){
  const el=$("conn"); el.classList.toggle("off",!ok);
  el.querySelector("span").textContent=txt;
}
function filialDe(label){
  const p=pdvs.find(x=>x.label===label); if(p) return p.filial;
  return (label||"").split(" - ")[0].trim();
}
const nomeLoja = p => p.nome;

async function carregarPdvs(){
  try{
    const data = await dbGetAll("pdvs","select=filial,nome&ativo=eq.true&order=nome.asc");
    pdvs = (data||[]).map(x=>({filial:String(x.filial).trim(), nome:(x.nome||"").trim(), label:`${x.filial} - ${x.nome}`}));
    kvSet("pdvs", pdvs);
    return true;
  }catch(e){ console.error(e); return false; }
}
async function carregarVisitas(){
  try{
    const rows = await dbGetAll(TABLE,"select=*&order=data.desc");
    visitas = rows.filter(r=>!EXTRA_ID.test(String(r.id))).map(normVisita);
    invCarrega(rows.filter(r=>EXTRA_ID.test(String(r.id))));
    kvSet("visitas", visitas); kvSet("inv",{avisos,CFG});
    return true;
  }catch(e){ console.error(e); return false; }
}
function normVisita(v){
  return {...v, devolvidos:v.devolvidos||[], descartados:v.descartados||[], vitrine:v.vitrine||[], vendidos_fisico:v.vendidos_fisico||[],
    notes:v.notes||[], checklist:v.checklist||[], fotos:{antes:[],depois:[],vitrine:[],...(v.fotos||{})}};
}
async function atualizarDados(silencioso){
  const [a,b] = await Promise.all([carregarPdvs(), carregarVisitas()]);
  online = a && b;
  setConn(online ? `Conectado · ${pdvs.length} lojas` : "Sem conexão · usando dados salvos", online);
  if(!online && !silencioso) toast("Sem conexão. Mostrando os últimos dados salvos.");
  if(typeof checaRascunho==="function") checaRascunho();
  renderAtual();
  return online;
}
/* visitas "efetivas": tudo que não é agendada, incluindo as que estão na fila de envio */
function todasVisitas(){
  const ids = new Set(visitas.map(v=>v.id));
  const f = fila.filter(x=>!ids.has(x.row.id)).map(x=>({...normVisita(x.row), _fila:true}));
  return [...f, ...visitas];
}
function ultimaVisitaPorFilial(ate){
  const m = {};
  todasVisitas().forEach(v=>{
    if(v.status==="Agendada" || !v.data) return;
    if(ate && v.data>ate) return;
    const f=filialDe(v.pdv);
    if(!m[f] || v.data>m[f].data) m[f]=v;
  });
  return m;
}
function totais(arr){
  let itens=0, un=0;
  (arr||[]).forEach(i=>{ if(i.cod||i.desc){ itens++; un+= Number(i.qtd)||0; } });
  return {itens, un};
}
function gargalosAbertos(){
  const out=[];
  todasVisitas().forEach(v=>(v.notes||[]).forEach((n,i)=>{
    if(n.tipo==="gargalo" && !n.resolvido) out.push({v, n, i});
  }));
  return out.sort((a,b)=>(b.v.data||"").localeCompare(a.v.data||""));
}
async function resolverNota(visitaId, idx){
  const v = visitas.find(x=>x.id===visitaId);
  if(!v){ toast("Essa visita ainda não foi enviada. Envie primeiro."); return; }
  const notes = v.notes.map((n,i)=> i===idx ? {...n, resolvido:true, resolvido_em:hoje()} : n);
  try{
    await dbPatch(TABLE, "id=eq."+encodeURIComponent(visitaId), {notes});
    v.notes = notes; kvSet("visitas", visitas);
    toast("Gargalo marcado como resolvido");
    renderAtual();
  }catch(e){ toast(ehRede(e)?"Sem internet para atualizar agora.":"Erro: "+e.message); }
}

/* ================= FILA DE ENVIO (offline) ================= */
async function carregarFila(){ fila = (await kvGet("fila")) || []; marcaPendentes(); }
function marcaPendentes(){
  const el=$("pend");
  el.classList.toggle("hide",!fila.length);
  el.classList.add("warn");
  el.querySelector("span").textContent = fila.length+(fila.length===1?" visita para enviar":" visitas para enviar");
}
let sincronizando=false;
async function sincronizar(manual){
  if(sincronizando || !fila.length) return;
  if(!navigator.onLine){ if(manual) toast("Sem internet. Envio automático quando voltar."); return; }
  sincronizando=true; let ok=0;
  try{
    for(const item of [...fila]){
      try{
        await enviarVisitaRow(item.row, item.fotos);
        fila = fila.filter(x=>x!==item); ok++;
        await kvSet("fila", fila);
      }catch(e){ if(ehRede(e)) break; console.error(e); if(manual) toast("Erro ao enviar: "+e.message); }
    }
  } finally { sincronizando=false; }
  marcaPendentes();
  if(ok){ toast(ok+(ok===1?" visita enviada":" visitas enviadas")); await atualizarDados(true); }
}
/* ================= NAVEGAÇÃO E CAMADAS ================= */
let view = "painel";
const SCR={}; let uiReset=false;
/* guarda o que está aberto no histórico (cards, grupo em destaque, listas) para voltar igual */
function uiCapt(){
  const hl=document.getElementById("hlist"); if(!hl) return null;
  const s={hd:[...hl.querySelectorAll(".hd.on")].map(e=>e.id),cat:[],foco:null};
  hl.querySelectorAll(".cats").forEach(c=>{ const b=c.querySelector(".cat.on"); if(b) s.cat.push([c.id.slice(5),b.dataset.k]); });
  const f=hl.querySelector(".foco"); if(f&&f.dataset.vid){ const d=f.querySelector(".fd"); s.foco={gid:f.id.slice(3),vid:f.dataset.vid,dados:!!(d&&!d.hidden)}; }
  return s;
}
function uiRest(s){
  if(!s) return;
  s.hd.forEach(id=>{ const e=document.getElementById(id); if(e) e.classList.add("on"); });
  if(s.foco){ grpFoco(s.foco.gid,s.foco.vid,true); if(s.foco.dados) grpDados(s.foco.vid); }
  s.cat.forEach(([id,k])=>{ const c=document.getElementById("cats-"+id), b=c&&c.querySelector('.cat[data-k="'+k+'"]'); if(b&&!b.disabled&&!b.classList.contains("on")) toggleCat(id,k,b); });
}
function go(v, nopush, keep){
  if(view) SCR[view]=window.scrollY;
  if(v===view && keep){ window.scrollTo(0,0); return; }
  if(v!==view || !keep) uiReset=!keep;
  if(v==="visita") prepararVisita();
  view=v;
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));
  document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  document.body.classList.toggle("wiz-on", v==="visita");
  if(!nopush) try{ history.pushState({v},"","#"+v); }catch(e){}
  renderAtual();

function calcPainel(y,m){
  const hojeS=hoje(), hojeD=new Date();
  const pref=`${y}-${pad(m+1)}`;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const firstS=ymd(first), lastS=ymd(last);
  const atual=hojeS.startsWith(pref), passado=hojeS>lastS, futuro=hojeS<firstS;
  const ref = atual?hojeS:(passado?lastS:firstS);
  const vm = todasVisitas().filter(v=>v.data && v.data.startsWith(pref) && v.status!=="Agendada");
  const vis = new Set(vm.map(v=>filialDe(v.pdv)));
  const ult = ultimaVisitaPorFilial(ref);
  const lojas = pdvs.map(p=>{
    const u=ult[p.filial]; const dias=u?diffDias(u.data,ref):null; const v=vis.has(p.filial);
    const cls = v?"c-v": dias==null?"c-n": dias<=30?"c-r": dias<=60?"c-a":"c-x";
    return {...p,u,dias,vis:v,cls};
  });
  const total=lojas.length, nv=lojas.filter(l=>l.vis).length, falta=total-nv;
  const decorridos = futuro?0:diasUteis(first, atual?hojeD:last);
  const restantes = passado?0:diasUteis(atual?hojeD:first, last);
  const ritmoAtual = decorridos>0 ? nv/decorridos : 0;
  const ritmoNec = restantes>0 ? falta/restantes : (falta>0?Infinity:0);
  const proj = Math.min(total, Math.round(nv + ritmoAtual*(atual?Math.max(restantes-0,0):0)));
  const sem=[0,0,0,0];
  vm.forEach(v=>{ const d=Number(v.data.slice(8,10)); sem[Math.min(3,Math.floor((d-1)/7))]++; });
  const soma = k => vm.reduce((a,v)=>{ const t=totais(v[k]); a.itens+=t.itens; a.un+=t.un; return a; },{itens:0,un:0});
  const dev=soma("devolvidos"), desc=soma("descartados"), vit=soma("vitrine"), fis=soma("vendidos_fisico");
  const lojasFis = new Set(vm.filter(v=>totais(v.vendidos_fisico).itens>0).map(v=>filialDe(v.pdv))).size;
  const lojasVit = new Set(vm.filter(v=>totais(v.vitrine).itens>0).map(v=>filialDe(v.pdv))).size;
  const rk={}; vm.forEach(v=>{ const f=filialDe(v.pdv); rk[f]=(rk[f]||0)+totais(v.descartados).un; });
  const rank = Object.entries(rk).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(([f,un])=>({f,un,nome:(pdvs.find(p=>p.filial===f)||{}).nome||f}));
  const pendentes = lojas.filter(l=>!l.vis).sort((a,b)=>(b.dias==null?99999:b.dias)-(a.dias==null?99999:a.dias));
  return {y,m,pref,atual,passado,futuro,ref,vm,total,nv,falta,decorridos,restantes,ritmoAtual,ritmoNec,proj,sem,dev,desc,vit,fis,lojasFis,lojasVit,rank,lojas,pendentes};
}

const STEPS = [
  {k:"abertura",t:"Abertura"},{k:"antes",t:"Estoque"},{k:"dev",t:"Devolvidos"},{k:"desc",t:"Descartados"},
  {k:"vit",t:"Vitrine"},{k:"venfis",t:"Vendidos"},{k:"fim",t:"Fechamento"}
];
function novaVisita(label){
  V = {id:"v"+Date.now(), pdv:label||"", data:hoje(), hora_inicio:"", hora_fim:"", volumes_estoque:"", volumes_inventario:"",
    analista:ls.get("vx_analista",""), gestores:"", status:"Em andamento", checklist:[],
    devolvidos:[], descartados:[], vitrine:[], vendidos_fisico:[], notes:[], fotos:{antes:[],depois:[],vitrine:[]},
    started_ts:null, editando:false, step:0};
  touch(true);
}
function prepararVisita(){ if(!V){ V={id:"v"+Date.now(), pdv:"", data:hoje(), hora_inicio:"", hora_fim:"", volumes_estoque:"", volumes_inventario:"", analista:ls.get("vx_analista",""), gestores:"", status:"Em andamento", checklist:[], devolvidos:[], descartados:[], vitrine:[], vendidos_fisico:[], notes:[], fotos:{antes:[],depois:[],vitrine:[]}, started_ts:null, editando:false, step:0}; } }
let _dt;
function touch(agora){
  clearTimeout(_dt);
  const f=()=>kvSet("draft", V && (V.pdv||V.started_ts) ? V : null);
  if(agora) f(); else _dt=setTimeout(f,500);
  if(typeof agendaAuto==="function") agendaAuto(agora);
}
async function descartarRascunho(){
  if(!confirm("Descartar a visita em andamento? Os dados dela serão perdidos"+(V&&V.srv?", inclusive a cópia salva no sistema":"")+".")) return;
  const id=V&&V.id, srv=V&&V.srv; clearTimeout(_asT);
  V=null; kvSet("draft",null); renderAtual(); toast("Rascunho descartado");
  if(srv && id){
    try{ await dbDelete(TABLE,"id=eq."+encodeURIComponent(id)); visitas=visitas.filter(v=>v.id!==id); kvSet("visitas",visitas); renderAtual(); }
    catch(e){ toast("Não consegui remover do sistema agora. Exclua pelo Histórico.",4500); }
  }
}
// continuar, neste aparelho, uma visita que ficou "Em andamento" no sistema (iniciada em outro aparelho)
function continuarVisita(id){
  const v=todasVisitas().find(x=>x.id===id); if(!v) return;
  const c=JSON.parse(JSON.stringify(v)); delete c._fila;
  const m=(c.fotos&&c.fotos.meta)||{}; const hi=c.hora_inicio?String(c.hora_inicio).slice(0,5):"";
  let ts=Date.now();
  if(c.data===hoje() && hi){ const t=new Date(c.data+"T"+hi+":00"); if(!isNaN(t.getTime())) ts=Math.min(ts,t.getTime()); }
  V={...c, volumes_estoque:c.volumes_estoque||"", volumes_inventario:c.volumes_inventario||"", hora_inicio:hi, hora_fim:"", gestores:c.gestores||"", analista:c.analista||"",
    status:"Em andamento", started_ts:ts, editando:false, step:Math.max(0,Math.min(STEPS.length-1,m.step||0)), srv:true, srv_ts:c.salvo_em||null};
  touch(true); go("visita");
}
function editarVisita(id,passo){
  const v = todasVisitas().find(x=>x.id===id); if(!v) return;
  const c = JSON.parse(JSON.stringify(v)); delete c._fila;
  V = {...c, volumes_estoque:c.volumes_estoque||"", volumes_inventario:c.volumes_inventario||"", hora_inicio:c.hora_inicio||"", hora_fim:c.hora_fim||"", gestores:c.gestores||"", analista:c.analista||"", started_ts:null, editando:true, step:Math.max(0,STEPS.findIndex(s=>s.k===passo))};
  go("visita");
}
function cancelarEdicao(){ V=null; kvSet("draft",null); go("hist"); }
function sairVisita(){ go("painel"); }

const fmtDur = ms => { const s=Math.max(0,Math.floor(ms/1000)); return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60); };
setInterval(()=>{
  if(view!=="visita"||!V||!V.started_ts||V.editando) return;
  const t=fmtDur(Date.now()-V.started_ts);
  document.querySelectorAll(".clk-t").forEach(e=>e.textContent=t);
},1000);

function listaAnalistas(){
  const s=new Set(ANALISTAS); visitas.forEach(v=>{ if(v.analista) s.add(v.analista); });
  if(V&&V.analista) s.add(V.analista);
  return [...s].sort((a,b)=>a.localeCompare(b,"pt-BR"));
}
function renderWiz(){
  const box=$("v-visita");
  if(!V){ prepararVisita(); }
  const st=V.step, S=STEPS[st];
  const nomeLj = V.pdv?lojaNome(V.pdv):"Escolha a loja";
  const clock = V.editando ? `Editando visita de ${fmtDM(V.data)}` : (V.started_ts ? `desde ${V.hora_inicio}` : "Aguardando início");
  const clk = (V.started_ts&&!V.editando) ? fmtDur(Date.now()-V.started_ts) : "00:00:00";
  const mob = `<div class="wmob"><div class="l1"><button class="x" onclick="${V.editando?"cancelarEdicao()":"sairVisita()"}" aria-label="Sair">${ICO_X}</button><div class="brand">VX<b>CASE</b></div><div class="sv"><i></i>${svTxt()}</div></div>
    <small>${V.editando?"Editando visita":"Visita em andamento"}</small>
    ${V.editando?"":`<div class="clk"><span class="clk-t" style="font:inherit;color:inherit;margin:0">${clk}</span><span>${V.started_ts?"desde "+V.hora_inicio:""}</span></div>`}
    <div class="lj">${esc(nomeLj)}</div>
    <div class="sg">${STEPS.map((_,i)=>`<i class="${i<=st?"on":""}"></i>`).join("")}</div>
    <small>Etapa ${st+1} de ${STEPS.length} · ${S.t}</small></div>`;
  const rail = `<aside class="rail"><div class="tm"><small>${V.editando?"Editando visita":"Visita em andamento"}</small>${V.editando?"":`<div class="clk clk-t">${clk}</div>`}<div class="lj">${esc(nomeLj)}</div><small style="margin-top:4px">${clock}</small></div>
    <div class="steps">${STEPS.map((s,i)=>{
      const n=contaEtapa(s.k);
      return `<button class="${i===st?"on":(i<st?"dn":"")}" onclick="goStep(${i})"><span class="n">${i<st?ICO_CK.replace('<svg','<svg width="12" height="12"'):i+1}</span>${s.t}${n?`<span class="c">${n}</span>`:""}</button>`;}).join("")}</div>
    ${V.editando?`<button class="btn blk" style="margin-top:12px" onclick="cancelarEdicao()">Cancelar edição</button>`:`<button class="btn red blk" style="margin-top:12px" onclick="descartarRascunho()">Descartar rascunho</button>`}</aside>`;
  box.innerHTML = `${mob}<div class="wiz">${rail}<div class="wbody"><div class="wcard" id="wstep">${etapaHTML(S.k)}</div>${footHTML()}</div></div>`;
}
function contaEtapa(k){
  if(k==="dev"||k==="desc"||k==="vit"||k==="venfis"){ const n=totais(V[LISTAS[k].campo]).itens; return n?n+" itens":""; }
  return "";
}
function footHTML(){
  const st=V.step, last=st===STEPS.length-1;
  let prim;
  if(st===0 && !V.editando && !V.started_ts) prim=`<button class="btn pri" onclick="iniciarAgora()">Iniciar visita (marca ${horaAgora()} sozinho)</button>`;
  else if(last) prim=`<button class="btn pri" id="btnFin" onclick="salvarVisita(true)">${V.editando?"Salvar alterações":"Finalizar visita"}</button>`;
  else prim=`<button class="btn pri" onclick="goStep(${st+1})">Próxima: ${STEPS[st+1].t}</button>`;
  const salvaEd=(V.editando&&!last)?`<button class="btn" onclick="salvarVisita(true)">Salvar alterações</button>`:"";
  return `<div class="wfoot">${st>0?`<button class="btn back" onclick="goStep(${st-1})">Voltar</button>`:""}${salvaEd}${prim}</div>`;
}
/* bloco com uma foto só (sem a do depois, ou avulsa) é válido: a vaga vazia é fechada sozinha */
function fecharBlocoAtual(){ const A=V.fotos.antes, D=V.fotos.depois; while(D.length<A.length) D.push(""); while(A.length<D.length) A.push(""); }
function goStep(i){
  if(i>0 && !V.pdv){ toast("Escolha a loja primeiro."); i=0; }
  if(STEPS[V.step]&&STEPS[V.step].k==="antes" && i>V.step){
    fecharBlocoAtual();
  }
  paresNovo=false;
  V.step=Math.max(0,Math.min(STEPS.length-1,i)); touch(true); renderWiz(); window.scrollTo({top:0,behavior:"auto"});
}
function iniciarAgora(){
  if(!V.pdv){ toast("Escolha a loja para iniciar."); return; }
  V.started_ts=Date.now(); V.hora_inicio=horaAgora(); vib(15);
  if(V.analista) ls.set("vx_analista",V.analista);
  goStep(1);
}
function etapaHTML(k){
  if(k==="abertura") return abertura();
  if(k==="antes") return `<h2>Estoque</h2><div class="lead">Cada bloco tem a foto de antes e a de depois, lado a lado.</div><div id="fb-pares">${paresHTML()}</div>`;
  if(LISTAS[k]) return listaStep(k);
  if(k==="fim") return fechamento();
  return "";
}
function abertura(){
  const l = V.pdv ? pdvs.find(p=>p.label===V.pdv)||pdvs.find(p=>p.filial===filialDe(V.pdv)) : null;
  let ctx="";
  if(V.pdv){
    const f=filialDe(V.pdv);
    const u = todasVisitas().filter(v=>filialDe(v.pdv)===f && v.status!=="Agendada" && v.id!==V.id && v.data).sort((a,b)=>b.data.localeCompare(a.data))[0];
    const g = gargalosAbertos().filter(x=>filialDe(x.v.pdv)===f && x.v.id!==V.id);
    const dias = u?diffDias(u.data,hoje()):null;
    ctx = `<div class="ctx">${u?`<span class="chip ${dias>60?"red":dias>30?"amb":"grn"}"><i></i>${dias} ${dias===1?"dia":"dias"} sem visita</span>
      <p>Última visita em ${fmtData(u.data)}${u.analista?" · "+esc(u.analista):""} · ${totais(u.devolvidos).itens} devolvidos e ${totais(u.descartados).itens} descartados.${g.length?` <b>${g.length} ${g.length===1?"pendência em aberto":"pendências em aberto"}.</b>`:""}</p>`
      :`<span class="chip"><i></i>Primeira visita registrada</span>`}
      ${g.map(x=>`<div class="pend"><b>Pendência da última visita</b>${esc(x.n.txt)} ${x.v._fila?"":`<a onclick="resolverNota('${x.v.id}',${x.i})">resolvida?</a>`}</div>`).join("")}</div>`;
  }
  const an = listaAnalistas();
  return `<h2>${V.editando?"Dados da visita":"Nova visita"}</h2><div class="lead">${V.editando?"Revise os dados e avance pelas etapas.":"Escolha a loja. O horário de início é marcado quando você tocar em iniciar."}</div>
  <div class="fld"><label>Loja</label><button class="pick" onclick="abrirLojas()">${V.pdv?`<span>${esc(l?l.nome:V.pdv)} <span class="mut" style="font-weight:400">· filial ${esc(filialDe(V.pdv))}</span></span>`:`<span class="ph mut">Selecione a loja</span>`}<svg width="14" height="9" viewBox="0 0 12 8" fill="none" stroke="#6c7268" stroke-width="2"><path d="M1 1l5 5 5-5"/></svg></button></div>
  ${ctx}
  <div class="f2"><div class="fld"><label>Analista</label><select class="in" onchange="setAnalista(this)">${V.analista?"":`<option value="">Selecione</option>`}${an.map(a=>`<option ${a===V.analista?"selected":""}>${esc(a)}</option>`).join("")}<option value="__o">Outro...</option></select></div>
  <div class="fld"><label>Data</label><input class="in" type="date" value="${esc(V.data)}" onchange="V.data=this.value;touch()"></div></div>
  <div class="fld"><label>Gestor presente</label><input class="in" placeholder="Nome do gestor da loja" value="${esc(V.gestores)}" oninput="V.gestores=this.value;touch()"></div>
  <div class="fld" style="margin-bottom:0"><label>Checklist</label>${CHECK_ITENS.map((c,i)=>`<button class="ck ${V.checklist.includes(c)?"on":""}" onclick="toggleCk(${i},this)"><span class="bx">${ICO_CK}</span>${c}</button>`).join("")}</div>`;
}
function setAnalista(sel){
  let v=sel.value;
  if(v==="__o"){ v=(prompt("Nome do analista")||"").trim(); if(!v){ renderWiz(); return; } }
  V.analista=v; ls.set("vx_analista",v); touch(); if(sel.value==="__o") renderWiz();
}
function toggleCk(i,btn){
  const c=CHECK_ITENS[i]; const k=V.checklist.indexOf(c);
  if(k>=0) V.checklist.splice(k,1); else V.checklist.push(c);
  btn.classList.toggle("on",k<0); vib(8); touch();
}
function abrirLojas(){
  const ult=ultimaVisitaPorFilial();
  const render=q=>{
    q=(q||"").toLowerCase();
    const arr=pdvs.filter(p=>!q||(p.nome+" "+p.filial).toLowerCase().includes(q));
    $("plist").innerHTML = arr.map(p=>{
      const u=ult[p.filial], d=u?diffDias(u.data,hoje()):null;
      const cls=d==null?"c-n":d<=30?"c-r":d<=60?"c-a":"c-x";
      return `<button onclick="setLoja('${esc(p.filial)}')"><i class="dot ${cls}"></i><div class="tx"><b>${esc(p.nome)}</b><span>Filial ${esc(p.filial)} · ${d==null?"nunca visitada":"visita há "+d+" dias"}</span></div></button>`;}).join("")||`<div class="empty">Nenhuma loja encontrada.</div>`;
  };
  openSheet(`${sheetHead("Escolha a loja")}<div class="sb"><input class="in" id="pq" placeholder="Buscar por nome ou número" autocomplete="off"><div class="pl" id="plist"></div></div>`);
  render(""); $("pq").oninput=e=>render(e.target.value);
  if(window.innerWidth>860) $("pq").focus();
}
function setLoja(f){
  const p=pdvs.find(x=>x.filial===f); if(!p) return;
  V.pdv=p.label; touch(true); closeSheet(); renderWiz();
}

/* ---- listas de itens ---- */
function scanOk(){ return ENABLE_CAMERA_SCAN && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && location.protocol!=="file:"; }
function listaStep(tipo){
  const L=LISTAS[tipo];
  const lead = {dev:"Itens que a loja devolveu ao estoque central.",desc:"Itens retirados para descarte, com o motivo.",vit:"Itens retirados da vitrine, com o motivo.",venfis:"Itens já vendidos que continuam fisicamente na loja."}[tipo];
  return `<h2>${L.nome}</h2><div class="lead">${lead}</div>
  <div class="tools">${scanOk()?`<button class="btn pri" onclick="scanAbrir('${tipo}')">${ICO_BAR} Ler código</button>`:""}<button class="btn" onclick="addItem('${tipo}',{},true)">+ Manual</button><button class="btn" onclick="abrirPaste('${tipo}')">Colar do Excel</button></div>
  <p class="cad" id="cad-${tipo}"></p>
  <div id="lbar-${tipo}"></div>
  <div id="lst-${tipo}">${linhasHTML(tipo)}</div>
  <div class="tot" id="tot-${tipo}"></div>
  ${tipo==="vit"?`<div class="fld" style="margin-top:18px"><label>Fotos da vitrine</label><div id="fb-vitrine">${fotosHTML("vitrine")}</div></div>`:""}`;
}
const LCOL={}, SCOL={};
const TP_SEC=[["estoque","Estoque"],["quotes","Quotes"]];
const ehQ=it=>it&&it.tp==="quotes";
function barraLista(tipo){
  const e=$("lbar-"+tipo); if(!e) return;
  const arr=V[LISTAS[tipo].campo].filter(i=>i.cod||i.desc), t=totais(arr);
  if(!arr.length){ e.innerHTML=""; return; }
  e.innerHTML=`<div class="lbar"><button type="button" class="lcol" onclick="toggleLista('${tipo}')" aria-expanded="${LCOL[tipo]?"false":"true"}"><i>${LCOL[tipo]?"▸":"▾"}</i><b>Lista</b><span>${nIt(t.itens)} · ${fmtN(t.un)} un${LCOL[tipo]?" · recolhida":""}</span></button><button type="button" class="btn sm red" onclick="apagarLista('${tipo}')">Apagar lista</button></div>`;
}
function toggleLista(tipo){ LCOL[tipo]=!LCOL[tipo]; relista(tipo); }
function toggleSec(tipo,tp){ SCOL[tipo+tp]=!SCOL[tipo+tp]; relista(tipo); }
function apagarLista(tipo){
  const L=LISTAS[tipo], n=V[L.campo].filter(i=>i.cod||i.desc).length;
  if(!n) return;
  openSheet(`${sheetHead("Apagar lista")}<div class="sb"><p style="margin:0">Apagar os <b>${n}</b> itens de <b>${esc(L.nome)}</b>? Isso não pode ser desfeito.</p></div>
    <div class="sf"><button class="btn" onclick="closeSheet()">Cancelar</button><button class="btn red" id="cfApagar">Apagar lista inteira</button></div>`);
  $("cfApagar").onclick=()=>{ V[L.campo]=[]; LCOL[tipo]=false; touch(); closeSheet(); relista(tipo); toast("Lista apagada"); };
}
function setTp(tipo,i){ const it=V[LISTAS[tipo].campo][i]; if(!it) return; it.tp=ehQ(it)?"estoque":"quotes"; vib(8); touch(); relista(tipo); }
function linhasHTML(tipo){
  const arr=V[LISTAS[tipo].campo];
  setTimeout(()=>{ updCad(tipo); updTot(tipo); },0);
  if(!arr.length) return `<div class="empty">Nenhum item ainda. Use o leitor, adicione manualmente ou cole do Excel.</div>`;
  if(LCOL[tipo]) return "";
  if(tipo!=="dev"&&tipo!=="desc") return arr.map((it,i)=>itemHTML(tipo,i,it)).join("");
  return TP_SEC.map(([tp,nome])=>{
    const pares=arr.map((it,i)=>[it,i]).filter(([it])=>ehQ(it)===(tp==="quotes"));
    if(!pares.length) return "";
    const t=totais(pares.map(p=>p[0])), fechada=!!SCOL[tipo+tp];
    return `<div class="sec ${tp}"><button type="button" class="sech" onclick="toggleSec('${tipo}','${tp}')" aria-expanded="${fechada?"false":"true"}"><i>${fechada?"▸":"▾"}</i><b>${nome}</b><span id="sh-${tipo}-${tp}">${nIt(t.itens)} · ${fmtN(t.un)} un</span></button>${fechada?"":pares.map(([it,i])=>itemHTML(tipo,i,it)).join("")}</div>`;
  }).join("");
}
function stCad(cod){
  if(!cod) return "";
  const d=cacheProd[cod];
  if(d===undefined) return "";
  return d===null ? `<i class="dotc miss"></i>Código fora do cadastro` : `<i class="dotc ok"></i>No cadastro`;
}
function itemHTML(tipo,i,it){
  const L=LISTAS[tipo];
  const cod=`<input class="in cod" placeholder="Código do produto" inputmode="numeric" autocomplete="off" value="${esc(it.cod)}" oninput="setF('${tipo}',${i},'cod',this.value);lookupSoon('${tipo}',${i})" onchange="lookupItem('${tipo}',${i})">`;
  const desc=`<input class="in" id="d-${tipo}-${i}" placeholder="Descrição" value="${esc(it.desc)}" oninput="setF('${tipo}',${i},'desc',this.value)">`;
  const topo = L.barras
    ? `<div class="r1 rb">${cod}<input class="in cod" placeholder="Código de barras" inputmode="numeric" autocomplete="off" value="${esc(it.barras||"")}" oninput="setF('${tipo}',${i},'barras',this.value)"></div>
   <div class="r1 rd">${desc}</div>`
    : `<div class="r1">${cod}${desc}</div>`;
  if((tipo==="dev"||tipo==="desc")&&!L.barras){
    const qt=it.trava?`<div class="qfix" title="Quantidade importada do Excel">${Number(it.qtd)||0}<small>un</small></div>`:`<div class="stp"><button onclick="stp('${tipo}',${i},-1)" aria-label="Menos">−</button><input id="q-${tipo}-${i}" inputmode="numeric" value="${it.qtd??1}" oninput="setF('${tipo}',${i},'qtd',this.value)"><button onclick="stp('${tipo}',${i},1)" aria-label="Mais">+</button></div>`;
    return `<div class="it cp"><div class="cw">${cod}<span class="cdt" id="s-${tipo}-${i}">${stCad(it.cod)}</span></div>${desc}${qt}
     ${L.motivos?`<select class="in mt" onchange="setF('${tipo}',${i},'motivo',this.value)"><option value="">Motivo</option>${L.motivos.map(m=>`<option ${it.motivo===m?"selected":""}>${m}</option>`).join("")}</select>`:""}</div>`;
  }
  return `<div class="it">
   ${topo}
   <div class="r1 rs" style="margin-top:-4px"><span class="mut" style="font-size:12.5px;min-height:15px" id="s-${tipo}-${i}">${stCad(it.cod)}</span>${(tipo==="dev"||tipo==="desc")?`<button type="button" class="tpb ${ehQ(it)?"q":"e"}" onclick="setTp('${tipo}',${i})" title="Toque para trocar">${ehQ(it)?"Quotes":"Estoque"}</button>`:""}</div>
   <div class="r2">${L.motivos?`<select class="in" onchange="setF('${tipo}',${i},'motivo',this.value)"><option value="">Motivo</option>${L.motivos.map(m=>`<option ${it.motivo===m?"selected":""}>${m}</option>`).join("")}</select>`:""}
     ${it.trava?`<div class="qfix" title="Quantidade importada do Excel">${Number(it.qtd)||0}<small>un</small></div>`:`<div class="stp"><button onclick="stp('${tipo}',${i},-1)" aria-label="Menos">−</button><input id="q-${tipo}-${i}" inputmode="numeric" value="${it.qtd??1}" oninput="setF('${tipo}',${i},'qtd',this.value)"><button onclick="stp('${tipo}',${i},1)" aria-label="Mais">+</button></div>`}
     <button class="rmv" onclick="rmItem('${tipo}',${i})" aria-label="Remover">${ICO_TR}</button></div></div>`;
}
function setF(tipo,i,f,v){
  const it=V[LISTAS[tipo].campo][i]; if(!it) return;
  if(f==="desc") it._auto=false;
  it[f] = f==="qtd" ? (parseInt(String(v).replace(/\D/g,""))||0) : v;
  touch(); if(f==="qtd") updTot(tipo); if(f==="cod") updCad(tipo);
}
function stp(tipo,i,d){
  const it=V[LISTAS[tipo].campo][i]; it.qtd=Math.max(0,(Number(it.qtd)||0)+d);
  $("q-"+tipo+"-"+i).value=it.qtd; vib(8); touch(); updTot(tipo);
}
function rmItem(tipo,i){ V[LISTAS[tipo].campo].splice(i,1); touch(); relista(tipo); }
function relista(tipo){ const b=$("lst-"+tipo); if(b) b.innerHTML=linhasHTML(tipo); }
function addItem(tipo,it,foco){
  V[LISTAS[tipo].campo].push({cod:"",desc:"",qtd:1,motivo:"",...it}); touch(); relista(tipo);
  if(foco){ const cards=document.querySelectorAll("#lst-"+tipo+" .it"); const c=cards[cards.length-1]; if(c){ c.scrollIntoView({block:"center",behavior:"smooth"}); if(window.innerWidth>860) c.querySelector("input").focus(); } }
}
function updTot(tipo){

/* estampa dentro do nome: "Produto Modelo - Cor Estampa". O que vem depois da cor é a estampa. */
const COR_FRASES=["transparente com bordas laterais em preto metálico","transparente com borda preta","preta fosca","preto fosco","verde meia-noite","verde meia noite","azul meia noite","azul meia-noite","couro marrom claro","couro marrom","couro preto","grafite glitter","branco/rosa","preto/rosa"];
const COR_PALAVRAS=["transparente","preta","preto","branca","branco","champagne","rosê","rose","rosa","verde","azul","brilhante","iogurte","marrom","lilás","lilas","lilac","green","brown","rouge","grafite","fúcsia","fucsia","roxa","roxo","cinza","chumbo","vermelho","vermelha","dourado","dourada","prata","amarelo","amarela","laranja","vinho","bege","nude","premium","emerald","ruby","couro","glitter","fosco","fosca","cristal","incolor","natural","verde-água","salmão","coral","off-white","bordô","petróleo"];
function estDoNome(nome){
  const s=String(nome||"").replace(/ /g," ").replace(/\s+/g," ").trim();
  const m=s.match(/\s*-\s+/); if(!m) return "";
  const suf=s.slice(m.index+m[0].length).trim(); if(!suf) return "";
  const low=suf.toLowerCase();
  for(const f of COR_FRASES){ if(low===f) return ""; if(low.startsWith(f+" ")) return suf.slice(f.length).trim(); }
  const w=suf.split(" "); const p=w[0].toLowerCase();
  if(w.length===1) return "";
  if(COR_PALAVRAS.includes(p)) return w.slice(1).join(" ").trim();
  return w.slice(1).join(" ").trim();
}
function estOk(s){ s=String(s||"").replace(/\u00a0/g," ").trim(); return !!s && !/^(-+|0|null|n\/a|na|nan|undefined)$/i.test(s); }
function parseExcel(raw){
  const linhas = raw.replace(/\r/g,"").split("\n").map(l=>l.split("\t"));
  const norm = s => (s||"").toString().trim().toLowerCase();
  let h=-1, ci={cod:-1,desc:-1,est:-1,qtd:-1};
  for(let i=0;i<linhas.length;i++){
    const cols=linhas[i].map(norm);
    const cCod = cols.findIndex(c=>c.includes("id do produto"));
    const cQtd = cols.findIndex(c=>c.includes("quantidade"));
    if(cCod>-1 && cQtd>-1){
      h=i; ci.cod=cCod; ci.qtd=cQtd;
      ci.desc=cols.findIndex(c=>c.includes("nome do produto"));
      ci.est =cols.findIndex(c=>c.includes("estampa"));
      break;
    }
  }
  const itens=[];
  if(h>-1){
    for(let i=h+1;i<linhas.length;i++){
      const row=linhas[i]; const first=norm(row[0]);
      if(row.every(c=>norm(c)==="")) continue;
      if(first.startsWith("emitido em")) break;
      const cod=(row[ci.cod]||"").trim();
      let desc=(row[ci.desc]||"").trim();
      const est=ci.est>-1?(row[ci.est]||"").trim():"";
      let temEst=estOk(est);
      if(temEst) desc = desc?`${desc} - ${est}`:est;
      else if(ci.est===-1 && estOk(estDoNome(desc))) temEst=true;
      const qtd=parseInt((row[ci.qtd]||"").replace(/\./g,"").replace(/[^\d]/g,""))||0;
      if(cod||desc) itens.push({cod,desc,qtd,tp:temEst?"quotes":"estoque"});
    }
    return {itens, modo:"cabeçalho"};
  }
  for(const row of linhas){
    if(row.every(c=>norm(c)==="")) continue;
    if(norm(row[0]).startsWith("emitido em")) continue;
    if(norm(row[0]).includes("relatório")) continue;
    if(row.length<2) continue;
    const cod=(row[0]||"").trim(); const desc=(row[1]||"").trim();
    const qtd=parseInt((row[row.length-1]||"").replace(/\./g,"").replace(/[^\d]/g,""))||0;
    if(cod||desc) itens.push({cod,desc,qtd});
  }
  return {itens, modo:"sem cabeçalho"};
}
function parseDescarteAgg(raw){
  const linhas = raw.replace(/\r/g,"").split("\n").map(l=>l.split("\t"));
  const norm = s => (s||"").toString().replace(/ /g," ").trim().toLowerCase().replace(/\s+/g," ");
  let h=-1, ci={cod:-1,desc:-1,qtd:-1,est:-1};
  for(let i=0;i<linhas.length;i++){
    const cols=linhas[i].map(norm);
    const cod=cols.findIndex(c=>(c==="código"||c==="codigo"||((c.includes("código")||c.includes("codigo"))&&!c.includes("barra"))));
    const prod=cols.findIndex(c=>c.includes("produto"));
    if(cod>-1 && prod>-1){ h=i; ci.cod=cod; ci.desc=prod; ci.qtd=cols.findIndex(c=>c.includes("quantidade")); ci.est=cols.findIndex(c=>c.includes("estampa")); break; }
  }
  const mapa=new Map();
  const start=h>-1?h+1:0;
  for(let i=start;i<linhas.length;i++){
    const row=linhas[i];
    if(row.every(c=>norm(c)==="")) continue;
    const f=norm(row[0]);
    if(f.startsWith("emitido em")||f.includes("auditoria")||f.includes("relatório")) continue;
    const cod=(h>-1?(row[ci.cod]||""):(row[0]||"")).toString().trim();
    if(!cod) continue;
    let desc=(h>-1?(row[ci.desc]||""):(row[1]||"")).toString().replace(/ /g," ").replace(/\s+/g," ").trim();
    let add=1;
    if(h>-1&&ci.qtd>-1){ const q=parseInt((row[ci.qtd]||"").toString().replace(/[^\d]/g,"")); if(!isNaN(q)) add=q; }
    const est=(h>-1&&ci.est>-1)?(row[ci.est]||"").toString().trim():"";
    const cur=mapa.get(cod)||{cod,desc,qtd:0,tp:"estoque"};
    cur.qtd+=add; if(!cur.desc&&desc) cur.desc=desc;
    if(cur.tp!=="quotes"){
      if(estOk(est)){ cur.tp="quotes"; cur.desc=cur.desc?`${cur.desc} - ${est}`:est; }
      else if(ci.est===-1 && estOk(estDoNome(desc))){ cur.tp="quotes"; if(desc) cur.desc=desc; }
    }
    mapa.set(cod,cur);
  }
  return {itens:[...mapa.values()], modo:`agrupado por código (${mapa.size} códigos)`};
}
function parseForTarget(raw, target){ return target==="desc" ? parseDescarteAgg(raw) : parseExcel(raw); }
function confirmarPaste(){
  const {itens}=parseForTarget($("pasteArea").value, pasteTarget);
  if(!itens.length){ toast("Nenhum item reconhecido. Confira o texto colado."); return; }

  itens.forEach(i=>V[campo].push({cod:i.cod,desc:i.desc,qtd:i.qtd,motivo:"",tp:i.tp==="quotes"?"quotes":"estoque",...((tipo==="dev"||tipo==="desc")?{trava:1}:{})}));
  touch(); closeSheet(); relista(tipo);
  toast(itens.length+" itens importados");
  preencherDescricoes(tipo);
}

/* ---- leitor de código de barras (câmera) ---- */
let scan=null, scanTipo=null;
function carregarZX(){
  if(window.ZXing) return Promise.resolve();
  return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"; s.onload=res; s.onerror=()=>rej(new Error("zxing")); document.head.appendChild(s); });
}
async function scanAbrir(tipo){
  scanTipo=tipo; $("scan").classList.add("on"); $("sct").textContent="Ler: "+LISTAS[tipo].nome;
  $("scl").innerHTML='<span class="spin"></span> Abrindo a câmera';
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    scanFechar(); toast(e&&e.name==="NotAllowedError"?"Permita o uso da câmera nas configurações do navegador.":"Não foi possível abrir a câmera neste aparelho.",4000); return;
  }
  const v=$("scv"); v.srcObject=stream; try{ await v.play(); }catch(e){}
  scan={stream,stop:false,last:"",lastT:0};
  let det=null, reader=null;
  try{
    if("BarcodeDetector" in window){
      let f=["ean_13","ean_8","code_128","code_39","upc_a","upc_e","itf"];
      try{ const sup=await BarcodeDetector.getSupportedFormats(); f=f.filter(x=>sup.includes(x)); }catch(e){}
      if(f.length) det=new BarcodeDetector({formats:f});
    }
    if(!det){
      await carregarZX();
      const Z=window.ZXing, hints=new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.ITF]);
      hints.set(Z.DecodeHintType.TRY_HARDER,true);
      reader=new Z.MultiFormatReader(); reader.setHints(hints);
    }
  }catch(e){ scanFechar(); toast("Não foi possível carregar o leitor. Verifique a internet.",4000); return; }
  $("scl").textContent="Aponte a câmera para o código";
  const cv=document.createElement("canvas"), cx=cv.getContext("2d",{willReadFrequently:true});
  const s=scan;
  const tick=async()=>{
    if(s.stop) return;
    try{
      if(v.videoWidth){
        let code="";
        if(det){ const r=await det.detect(v); if(r&&r[0]) code=r[0].rawValue; }
        else{
          const w=Math.min(1100,v.videoWidth), h=Math.round(w*v.videoHeight/v.videoWidth);
          cv.width=w; cv.height=h; cx.drawImage(v,0,0,w,h);
          const Z=window.ZXing;
          try{ code=reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText(); }catch(e){ code=""; }
        }
        if(code) scanLido(code);
      }
    }catch(e){}
    setTimeout(tick, det?150:220);
  };
  tick();
}
// soma 1 unidade do código no item da lista (cria o item se ainda não existe) e busca a descrição no cadastro
function addCodigo(tipo,code){
  const arr=V[LISTAS[tipo].campo];
  let it=arr.find(x=>String(x.cod)===code), n;
  if(it){ it.qtd=(Number(it.qtd)||0)+1; n=it.qtd; }
  else{ it={cod:code,desc:"",qtd:1,motivo:""}; arr.push(it); n=1; }
  touch(); relista(tipo);
  return {it,n,arr};
}
function scanLido(code){
  code=String(code).trim(); const agora=Date.now();
  if(!code) return;
  const gap=agora-scan.lastT; scan.lastT=agora;
  if(code===scan.last && gap<1300) return;   // código parado na frente da câmera conta uma vez só
  scan.last=code; vib(40);
  const {it,n,arr}=addCodigo(scanTipo,code);
  const show=()=>{ const d=it.desc || (cacheProd[code]===null?"Código fora do cadastro":"Buscando produto"); $("scl").innerHTML=`${esc(d)}<br><span style="font-weight:400;opacity:.8">${esc(code)} · ${n} lido${n>1?"s":""}</span>`; };
  show();
  lookupItem(scanTipo,arr.indexOf(it)).then(show);
}
function scanFechar(){
  if(scan){ scan.stop=true; try{ scan.stream.getTracks().forEach(t=>t.stop()); }catch(e){} scan=null; }
  const v=$("scv"); v.srcObject=null; $("scan").classList.remove("on");
}

function moverBloco(i,j){
  const F=V.fotos, A=F.antes, D=F.depois;
  while(D.length<A.length) D.push(""); while(A.length<D.length) A.push("");
  const n=A.length; if(j<0||j>=n||i===j){ closeSheet(); return; }
  const c=F.conf||(F.conf=[]), t=F.tipo||(F.tipo=[]);
  while(c.length<n) c.push(false); while(t.length<n) t.push("");
  [A,D,c,t].forEach(a=>a.splice(j,0,a.splice(i,1)[0]));

function comprimir(src,cb){
  const img=new Image();
  img.onload=()=>{
    const max=1100, sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",0.72));
  };
  img.onerror=()=>cb(null);
  img.src=src;
}

/* ---- salvar / enviar ---- */
function dataURLtoBlob(d){
  const [h,b]=d.split(","); const mime=(h.match(/:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function montarRow(final){
  const lim = a => (a||[]).filter(i=>i.cod||i.desc).map(i=>({cod:String(i.cod||"").trim(), desc:(i.desc||"").trim(), qtd:Number(i.qtd)||0, ...(i.motivo?{motivo:i.motivo}:{}), ...(i.barras&&String(i.barras).trim()?{barras:String(i.barras).trim()}:{}), ...(i.tp==="quotes"?{tp:"quotes"}:{}), ...(i.trava?{trava:1}:{})}));
  const row = {
    id:V.id, pdv:V.pdv, data:V.data||null, hora_inicio:V.hora_inicio||null, hora_fim:V.hora_fim||null,
    volumes_estoque:parseInt(V.volumes_estoque)||0, volumes_inventario:parseInt(V.volumes_inventario)||0,   // campos antigos, não são mais preenchidos
    analista:V.analista||"", gestores:(V.gestores||"").trim(), status:V.status, checklist:[...V.checklist],
    devolvidos:lim(V.devolvidos), descartados:lim(V.descartados), vitrine:lim(V.vitrine), vendidos_fisico:lim(V.vendidos_fisico),
    notes:V.notes.map(n=>({...n})), fotos:{antes:[...V.fotos.antes],depois:[...V.fotos.depois],vitrine:[...V.fotos.vitrine], ...(V.fotos.conf?{conf:[...V.fotos.conf]}:{}), ...(V.fotos.tipo&&V.fotos.tipo.some(Boolean)?{tipo:[...V.fotos.tipo]}:{}), meta:{step:V.step||0}},
    salvo_em:new Date().toISOString()
  };
  return row;
}
async function enviarVisitaRow(row, fotos){
  const out={antes:[],depois:[],vitrine:[]}; let falhas=0;
  for(const slot of ["antes","depois","vitrine"]){
    const arr=(fotos||row.fotos||{})[slot]||[];
    for(let i=0;i<arr.length;i++){
      const b=arr[i];
      if(typeof b==="string" && b.startsWith("data:")){
        try{ out[slot].push(await storageUpload(`${row.id}/${slot}-${i}-${b.length}.jpg`, dataURLtoBlob(b))); }
        catch(err){ if(ehRede(err)) throw err; console.error("foto",err); falhas++; }
      } else out[slot].push(b);
    }
  }
  const extras={}; const srcF=fotos||row.fotos||{};
  Object.keys(srcF).forEach(k=>{ if(k!=="antes"&&k!=="depois"&&k!=="vitrine") extras[k]=srcF[k]; });
  enviarVisitaRow.out=out;
  // o checklist é salvo à parte (e pode ter sido assinado pelo gestor): nunca é sobrescrito por aqui
  try{ const cur=await dbGet(TABLE,"select=fotos&id=eq."+encodeURIComponent(row.id)+"&limit=1"); if(cur[0]&&cur[0].fotos&&cur[0].fotos.insp) extras.insp=cur[0].fotos.insp; if(cur[0]&&cur[0].fotos&&cur[0].fotos.grp) extras.grp=cur[0].fotos.grp; }
  catch(e){ if(ehRede(e)) throw e; }
  await dbUpsert(TABLE, {...row, fotos:{...out, ...extras}}, "id");
  return falhas;
}
let salvando=false;
async function salvarVisita(final){
  if(salvando) return;
  clearTimeout(_asT); for(let k=0;_asBusy&&k<100;k++) await new Promise(r=>setTimeout(r,100));
  if(!V.pdv){ toast("Escolha a loja."); goStep(0); return; }
  if(final && !V.editando){ V.status="Concluída"; if(!V.hora_fim) V.hora_fim=horaAgora(); }
  const row=montarRow(final); const fotos=row.fotos;
  salvando=true; const b=$("btnFin"); if(b){ b.disabled=true; b.innerHTML='<span class="spin"></span> Salvando'; }
  toast("Salvando...");
  let enviado=true, falhas=0;
  try{
    falhas=await enviarVisitaRow(row, fotos);
  }catch(e){
    if(ehRede(e)){
      enviado=false;
      fila=fila.filter(x=>x.row.id!==row.id); fila.push({row,fotos});
      await kvSet("fila",fila); marcaPendentes();
    } else { console.error(e); toast("Erro ao salvar: "+(e.message||e),5000); salvando=false; if(b){ b.disabled=false; b.textContent=V.editando?"Salvar alterações":"Finalizar visita"; } return; }
  }
  salvando=false;
  const editando=V.editando, status=row.status;
  V=null; await kvSet("draft",null);
  if(enviado){
    fila=fila.filter(x=>x.row.id!==row.id); kvSet("fila",fila); marcaPendentes();
    await carregarVisitas(); 
  }
  const saved = enviado ? (visitas.find(x=>x.id===row.id)||normVisita(row)) : normVisita(row);
  if(editando){ go("hist"); toast(enviado?"Alterações salvas":"Sem internet. Alterações guardadas no aparelho."); return; }
  go("painel");
  doneSheet(saved, enviado, falhas, status);
}
function doneSheet(v, enviado, falhas, status){
  const fin = status==="Concluída";
  openSheet(`${sheetHead(fin?"Visita concluída":"Visita salva")}<div class="sb"><p style="margin:0 0 6px"><b>${esc(lojaNome(v.pdv))}</b> · ${fmtData(v.data)}</p>
    <p class="mut" style="margin:0">${enviado?"Os dados já estão no sistema.":"Sem internet agora. A visita ficou salva no aparelho e será enviada sozinha quando a conexão voltar."}${falhas?` ${falhas} foto(s) não subiram.`:""}</p></div>
    <div class="sf"><button class="btn" onclick="closeSheet()">Voltar ao painel</button><button class="btn pri" id="btnPdfDone">Gerar PDF e enviar</button></div>
    ${enviado&&fin?`<div class="sf" style="padding-top:0"><button class="btn blk" onclick="closeSheet();abrirChecklist('${v.id}')">Preencher checklist e enviar ao gestor</button></div>`:""}`);

/* ================= HISTÓRICO ================= */
let hf = {q:"", status:"", analista:"", mes:"", lim:60};
function renderHist(){
  const all=todasVisitas();
  const meses=[...new Set(all.map(v=>(v.data||"").slice(0,7)).filter(Boolean))].sort().reverse();
  const ans=[...new Set(all.map(v=>v.analista).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  $("v-hist").innerHTML = `<div class="ph"><div><h1>Histórico</h1><div class="sub" id="hcount"></div></div>
    <div class="acts"><button class="btn" onclick="grupoSheet()">Agrupar visitas</button><button class="btn" onclick="exportarSheet()">Exportar planilha</button><button class="btn pri" onclick="go('visita')">+ Nova visita</button></div></div>
    <div class="fil"><input class="in busca" id="hq" placeholder="Buscar loja, analista ou gestor" value="${esc(hf.q)}" oninput="hf.q=this.value;hf.lim=60;listaHist()">
    <select class="in" onchange="hf.mes=this.value;listaHist()"><option value="">Todos os meses</option>${meses.map(m=>`<option value="${m}" ${hf.mes===m?"selected":""}>${MESES[Number(m.slice(5))-1]} ${m.slice(0,4)}</option>`).join("")}</select>
    <select class="in" onchange="hf.status=this.value;listaHist()"><option value="">Todas as situações</option>${["Concluída","Em andamento","Agendada"].map(s=>`<option ${hf.status===s?"selected":""}>${s}</option>`).join("")}</select>
    <select class="in" onchange="hf.analista=this.value;listaHist()"><option value="">Todos os analistas</option>${ans.map(a=>`<option ${hf.analista===a?"selected":""}>${esc(a)}</option>`).join("")}</select></div>
    <div id="hlist"></div>`;
  listaHist();
}
function filtradas(){
  const q=hf.q.toLowerCase();
  return todasVisitas().filter(v=>
    (!q || ((v.pdv||"")+" "+(v.analista||"")+" "+(v.gestores||"")).toLowerCase().includes(q)) &&
    (!hf.status || v.status===hf.status) && (!hf.analista || v.analista===hf.analista) && (!hf.mes || (v.data||"").startsWith(hf.mes))
  ).sort((a,b)=>(b.data||"").localeCompare(a.data||"") || (b.hora_inicio||"").localeCompare(a.hora_inicio||""));
}
function stClass(v){ return v._fila?"p":v.status==="Concluída"?"c":v.status==="Agendada"?"a":"e"; }
function hiHTML(v){
    const d=totais(v.devolvidos), x=totais(v.descartados), t=totais(v.vitrine);
    return `<div class="hi"><button class="hh" onclick="document.getElementById('hd-${v.id}').classList.toggle('on')">
      <div class="tx"><b>${esc(lojaNome(v.pdv))}</b><span>${fmtData(v.data)}${v.hora_inicio?" · "+esc(v.hora_inicio.slice(0,5))+(v.hora_fim?" às "+esc(v.hora_fim.slice(0,5)):""):""} · ${esc(v.analista||"sem analista")}</span>${chkOkHTML(v)}</div>
      <div class="nums"><div class="nm d"><b>${d.itens}</b><small>Devolvidos</small></div><i class="vr"></i><div class="nm x"><b>${x.itens}</b><small>Descartados</small></div>${t.itens?`<i class="vr"></i><div class="nm v"><b>${t.itens}</b><small>Vitrine</small></div>`:""}</div>
      <span class="st ${stClass(v)}">${v._fila?"Aguardando envio":esc(v.status)}</span></button>
      <div class="hd" id="hd-${v.id}">${detalheHTML(v)}</div></div>`;
}
function listaHist(){
  const todas=filtradas(), arr=todas.slice(0,hf.lim);
  $("hcount").textContent = `${todas.length} ${todas.length===1?"visita":"visitas"}`;
  const vistos=new Set(); let h="";
  arr.forEach(v=>{ const g=grpDe(v); if(!g){ h+=hiHTML(v); return; } if(vistos.has(g.id)) return; vistos.add(g.id); h+=grpCardHTML(g.id); });
  $("hlist").innerHTML = arr.length ? h+(todas.length>arr.length?`<button class="btn blk" onclick="hf.lim+=60;listaHist()">Mostrar mais (${todas.length-arr.length})</button>`:"") : `<div class="card"><div class="empty">Nenhuma visita encontrada.</div></div>`;
}
function durMin(v){
  if(!v.hora_inicio||!v.hora_fim) return null;
  const [a,b]=v.hora_inicio.split(":").map(Number), [c,d]=v.hora_fim.split(":").map(Number);
  let m=(c*60+d)-(a*60+b); if(m<0) m+=1440; return m;
}
const fmtMin = m => m==null?"-": (m>=60?Math.floor(m/60)+"h"+pad(m%60):m+" min");
function tabelaHTML(titulo,arr,motivo,semTitulo){
  const a=(arr||[]).filter(i=>i.cod||i.desc); if(!a.length) return "";
  const t=totais(a);
  const bar=a.some(i=>i.barras), tpc=true;
  return `${semTitulo?"":`<h4>${titulo} · ${nIt(t.itens)} · ${fmtN(t.un)} un</h4>`}<div style="overflow-x:auto"><table class="tb"><tr><th class="c">Código</th>${bar?"<th class=\"c\">Cód. barras</th>":""}<th>Descrição</th>${tpc?"<th class=\"t\">Tipo</th>":""}<th class="q">Qtd</th></tr>${a.map(i=>`<tr><td class="c">${esc(i.cod)}</td>${bar?`<td class="c">${esc(i.barras||"-")}</td>`:""}<td>${esc(i.desc)}</td>${tpc?`<td class="t">${i.tp==="quotes"?"Quotes":"Estoque"}</td>`:""}<td class="q">${i.qtd}</td></tr>`).join("")}</table></div>`;
}
// cards das listas (devolvidos, descartados, vitrine, vendidos): clique abre só aquela lista, clique de novo recolhe
const CAT_ORDEM=[["dev","Devolvidos"],["desc","Descartados"],["vit","Vitrine retirada"],["venfis","Vendidos na loja"]];
function catCardsHTML(v){
  const id=esc(v.id);
  const cards=CAT_ORDEM.map(([k,nome])=>{
    const L=LISTAS[k], a=(v[L.campo]||[]).filter(i=>i.cod||i.desc), t=totais(a), vazio=!a.length;
    return `<button type="button" class="cat${vazio?" vz":""}" data-k="${k}" style="--c:${L.cor}" ${vazio?"disabled":`onclick="toggleCat('${id}','${k}',this)" aria-expanded="false"`}>
      <span class="cn">${nome}</span><b>${t.itens}</b><span class="cu">${t.itens?`${nIt(t.itens)} · ${fmtN(t.un)} un`:"nenhum item"}</span><i class="cs" aria-hidden="true"></i></button>`;
  }).join("");
  return `<div class="cats" id="cats-${id}">${cards}</div><div class="catp" id="catp-${id}" hidden></div>`;
}
function toggleCat(id,k,btn){
  const box=document.getElementById("cats-"+id), pan=document.getElementById("catp-"+id); if(!box||!pan) return;
  const abrir=!btn.classList.contains("on");
  box.querySelectorAll(".cat").forEach(b=>{ b.classList.remove("on"); b.setAttribute("aria-expanded","false"); });
  if(!abrir){ pan.hidden=true; pan.innerHTML=""; return; }
  const v=todasVisitas().find(x=>x.id===id); if(!v) return;
  const L=LISTAS[k];
  btn.classList.add("on"); btn.setAttribute("aria-expanded","true");
  pan.style.setProperty("--c",L.cor);
  pan.innerHTML=tabelaHTML(L.nome,v[L.campo],!!L.motivos,true); pan.hidden=false;
}
function blocosDe(f){
  const A=(f&&f.antes)||[], D=(f&&f.depois)||[], T=(f&&f.tipo)||[], n=Math.max(A.length,D.length), out=[];
  for(let i=0;i<n;i++){ const proc=T[i]==="proc"; out.push({n:i+1,proc,a:A[i]||"",d:D[i]||"",la:proc?(D[i]?"Avulsa 1":"Avulsa"):"Antes",ld:proc?"Avulsa 2":"Depois"}); }
  return out;
}
function blocosHTML(f,key,vid){
  const urls=[], caps=[];
  const cel=(u,l,b)=>{ if(!u) return `<div class="bkv">Sem foto</div>`; urls.push(u); caps.push("Bloco "+b.n+" · "+l); const k=urls.length-1;
    return `<figure><img loading="lazy" src="${esc(u)}" alt="" onclick="abrirLbUrls(window['${key}'],${k},window['${key}c'])"><figcaption>${l}</figcaption></figure>`; };
  const h=blocosDe(f).filter(b=>b.a||b.d).map(b=>`<div class="bk"><div class="bkh"><b>Bloco ${b.n}</b><span class="${b.proc?"pc":""}">${b.proc?"Avulsa":"Antes e depois"}</span>${vid?`<button type="button" class="bkm" onclick="hbMenu('${vid}',${b.n-1})" aria-label="Opções do bloco ${b.n}">Opções ⋯</button>`:""}</div><div class="bk2">${cel(b.a,b.la,b)}${b.proc&&!b.d?"":cel(b.d,b.ld,b)}</div></div>`).join("");
  window[key]=urls; window[key+"c"]=caps; return h;
}
function fotosSecHTML(v,sem){
  const fid="f"+v.id, vid=(v._fila?"":v.id);
  const blH=blocosHTML(v.fotos,fid,vid), vitF=(v.fotos.vitrine||[]), baseV=window[fid].length;
  window[fid]=window[fid].concat(vitF); window[fid+"c"]=window[fid+"c"].concat(vitF.map(()=>"Vitrine"));
  return `${blH?`<h4>Estoque: blocos de fotos</h4>${vid?`<p class="mut" style="font-size:12.5px;margin:2px 0 0">Toque em Opções de cada bloco para mover, tornar avulso, inverter antes e depois ou remover. Salva na hora.</p>`:""}${blH}`:""}${vitF.length?`<h4>Vitrine</h4><div class="ph-grid">${vitF.map((u,i)=>`<img loading="lazy" src="${esc(u)}" alt="" onclick="abrirLbUrls(window['${fid}'],${baseV+i},window['${fid}c'])">`).join("")}</div>`:""}`;
}
/* ---- organizar blocos direto no histórico (salva na hora) ---- */
function hbNorm(v){
  const F=v.fotos||{}, A=[...(F.antes||[])], D=[...(F.depois||[])], n=Math.max(A.length,D.length);
  while(A.length<n) A.push(""); while(D.length<n) D.push("");
  const T=[...(F.tipo||[])]; while(T.length<n) T.push(""); T.length=n;
  return {A,D,T,n};
}
function hbMenu(vid,i){
  const v=todasVisitas().find(x=>x.id===vid); if(!v) return; const {n,T}=hbNorm(v), proc=T[i]==="proc";
  const btn=(fn,txt,off,red)=>`<button class="btn${red?" red":""}" ${off?"disabled":""} style="width:100%;justify-content:flex-start;margin-bottom:8px" onclick="${fn}">${txt}</button>`;
  openSheet(`${sheetHead("Bloco "+(i+1)+(proc?" · avulsa":" · antes e depois"))}<div class="sb">
    ${btn(`hbMover('${vid}',${i},${i-1})`,"Subir para o bloco "+i,i===0)}
    ${btn(`hbMover('${vid}',${i},${i+1})`,"Descer para o bloco "+(i+2),i>=n-1)}
    ${btn(`hbPos('${vid}',${i})`,"Mover para outra posição…",n<2)}
    ${btn(`hbTipo('${vid}',${i})`,proc?"Transformar em bloco de antes e depois":"Tornar foto avulsa (sem antes e depois)")}
    ${proc?"":btn(`hbInverte('${vid}',${i})`,"Inverter: o antes vira depois e o depois vira antes")}
    ${btn(`hbRemover('${vid}',${i})`,"Remover o bloco inteiro",false,true)}</div>`);
}
function hbPos(vid,i){
  const v=todasVisitas().find(x=>x.id===vid); if(!v) return; const {n}=hbNorm(v);
  openSheet(`${sheetHead("Mover o bloco "+(i+1)+" para a posição")}<div class="sb"><div class="pos-g">${[...Array(n)].map((_,j)=>`<button class="btn${j===i?"":" pri"}" ${j===i?"disabled":""} onclick="hbMover('${vid}',${i},${j})">${j+1}</button>`).join("")}</div>
    <p class="mut" style="font-size:13px;margin:10px 0 0">Os outros blocos se ajustam sozinhos.</p></div>`);
}
async function hbSalva(v,A,D,T,msg){
  const F={...(v.fotos||{}),antes:A,depois:D,tipo:T}; if(F.conf){ const c=[...F.conf]; while(c.length<A.length) c.push(false); c.length=A.length; F.conf=c; }
  try{
    await dbPatch(TABLE,"id=eq."+encodeURIComponent(v.id),{fotos:F});
    v.fotos=F; try{ kvSet("visitas",visitas); }catch(e){}
    document.querySelectorAll('.fotsec[data-vid="'+v.id+'"]').forEach(el=>{ el.innerHTML=fotosSecHTML(v); });
    closeSheet(); toast(msg||"Alteração salva");
  }catch(e){ closeSheet(); toast(ehRede(e)?"Sem internet. A alteração não foi salva.":"Erro: "+e.message,4500); }
}
function hbMover(vid,i,j){
  const v=todasVisitas().find(x=>x.id===vid); if(!v) return; const {A,D,T,n}=hbNorm(v);
  if(j<0||j>=n||i===j){ closeSheet(); return; }
  [A,D,T].forEach(a=>a.splice(j,0,a.splice(i,1)[0]));
  hbSalva(v,A,D,T,"O bloco "+(i+1)+" agora é o bloco "+(j+1));
}
function hbTipo(vid,i){
  const v=todasVisitas().find(x=>x.id===vid); if(!v) return; const {A,D,T}=hbNorm(v);
  if(T[i]==="proc"){ if(!D[i]){ closeSheet(); toast("Para virar antes e depois, o bloco precisa ter as duas fotos.",4000); return; } T[i]=""; }
  else T[i]="proc";
  hbSalva(v,A,D,T,T[i]==="proc"?"Bloco "+(i+1)+" agora é foto avulsa":"Bloco "+(i+1)+" agora é antes e depois");
}
function hbInverte(vid,i){
  const v=todasVisitas().find(x=>x.id===vid); if(!v) return; const {A,D,T}=hbNorm(v);
  const x=A[i]; A[i]=D[i]; D[i]=x; hbSalva(v,A,D,T,"Antes e depois invertidos");
}
function hbRemover(vid,i){
  if(!confirm("Remover o bloco "+(i+1)+" e as fotos dele?")) return;
  const v=todasVisitas().find(x=>x.id===vid); if(!v) return; const {A,D,T}=hbNorm(v);
  A.splice(i,1); D.splice(i,1); T.splice(i,1); hbSalva(v,A,D,T,"Bloco removido");
}

function exportarSheet(){
  openSheet(`${sheetHead("Exportar planilha")}<div class="sb"><p class="mut" style="margin:0 0 12px;font-size:14px">Usa os filtros atuais do histórico (${filtradas().length} visitas). Abre direto no Excel.</p>

   <button class="btn blk" onclick="exportarCSV('itens')">Detalhado: uma linha por item</button></div>`);

function exportarCSV(tipo){
  const arr=filtradas();
  const cel=x=>{ x=(x??"").toString().replace(/\r?\n/g," "); return /[";]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; };
  let rows;
  if(tipo==="resumo"){
    rows=[["Data","Loja","Filial","Analista","Gestor","Situação","Início","Fim","Duração (min)","Vol. estoque","Vol. inventário","Devolvidos (itens)","Devolvidos (un)","Descartados (itens)","Descartados (un)","Vitrine (itens)","Vitrine (un)","Vendidos na loja (itens)","Vendidos na loja (un)","Gargalos"]];
    arr.forEach(v=>{ const a=totais(v.devolvidos),b=totais(v.descartados),c=totais(v.vitrine),d=totais(v.vendidos_fisico);
      rows.push([fmtData(v.data),lojaNome(v.pdv),filialDe(v.pdv),v.analista,v.gestores,v.status,v.hora_inicio||"",v.hora_fim||"",durMin(v)??"",v.volumes_estoque||0,v.volumes_inventario||0,a.itens,a.un,b.itens,b.un,c.itens,c.un,d.itens,d.un,v.notes.filter(n=>n.tipo==="gargalo").map(n=>n.txt).join(" | ")]); });
  } else {
    rows=[["Data","Loja","Filial","Analista","Lista","Código","Descrição","Motivo","Qtd"]];
    arr.forEach(v=>Object.values(LISTAS).forEach(L=>(v[L.campo]||[]).filter(i=>i.cod||i.desc).forEach(i=>rows.push([fmtData(v.data),lojaNome(v.pdv),filialDe(v.pdv),v.analista,L.nome,i.cod,i.desc,i.motivo||"",i.qtd]))));
  }
  const txt="﻿"+rows.map(r=>r.map(cel).join(";")).join("\r\n");
  baixar(new Blob([txt],{type:"text/csv;charset=utf-8"}), `visitas-${tipo}-${hoje()}.csv`);
  closeSheet(); toast("Planilha gerada");
}
function baixar(blob,nome){
  const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);
}

/* ================= PDFs ================= */
const PC={bar:[46,51,47],ink:[38,48,42],sage:[95,154,88],desc:[196,71,63],vit:[201,138,27],fis:[56,118,170],gnd:[236,235,230],line:[222,220,211],mut:[108,114,104],soft:[247,246,242],white:[255,255,255],sageL:[135,184,127]};
const PW=210, PH=297, ML=14, CW=182;
function pdfOk(){ if(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable) return true; toast("A biblioteca de PDF ainda não carregou. Conecte à internet e tente de novo.",4500); return false; }
/* ---- fontes do PDF (Inter + Source Serif, embutidas só quando o PDF pede; sem elas cai em Helvetica/Times) ---- */
let _fontesB64=null;
async function pdfFontes(doc){
  try{
    if(!_fontesB64 && typeof _FONTES_EMB!=="undefined") _fontesB64=_FONTES_EMB;
    if(!_fontesB64){
      const lista=[["Inter400","Inter_400Regular"],["Inter600","Inter_600SemiBold"],["Inter700","Inter_700Bold"],["Serif700","SourceSerif4_700Bold"]], out={};
      for(const [k,f] of lista){ const r=await fetch("fonts/"+f+".ttf"); if(!r.ok) throw new Error("fonte"); const u=new Uint8Array(await r.arrayBuffer()); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); out[k]=btoa(s); }
      _fontesB64=out;
    }
    const B=_fontesB64;
    doc.addFileToVFS("Inter400.ttf",B.Inter400); doc.addFont("Inter400.ttf","Inter","normal");
    doc.addFileToVFS("Inter700.ttf",B.Inter700); doc.addFont("Inter700.ttf","Inter","bold");
    doc.addFileToVFS("Inter600.ttf",B.Inter600); doc.addFont("Inter600.ttf","InterSB","normal");
    doc.addFileToVFS("Serif700.ttf",B.Serif700); doc.addFont("Serif700.ttf","SerifH","bold");
    doc._fn={sans:"Inter",semi:"InterSB",ser:"SerifH"};
  }catch(e){ console.warn("fontes do PDF indisponíveis, usando padrão",e); doc._fn=null; }
}
function sf(doc,e){
  const f=doc._fn;
  if(e==="serif") doc.setFont(f?f.ser:"times","bold");
  else if(e==="semi"){ if(f) doc.setFont(f.semi,"normal"); else doc.setFont("helvetica","bold"); }
  else doc.setFont(f?f.sans:"helvetica",e);
}
function pdfNovo(){ const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}); doc._drawn=new Set([1]); doc._st={y:0}; return doc; }
function pdfMarca(doc,x,y,size,claro){
  sf(doc,"bold"); doc.setFontSize(size);
  doc.setTextColor(...PC.white); doc.text("VX",x,y,{charSpace:size*0.05});
  const w=doc.getTextWidth("VX")+2*size*0.05+size*0.05;
  doc.setTextColor(...PC.sageL); doc.text("CASE",x+w,y,{charSpace:size*0.05});
}
function pdfCab(doc,titulo,sub){
  doc.setFillColor(...PC.bar); doc.rect(0,0,PW,34,"F"); doc.setFillColor(...PC.sage); doc.rect(0,34,PW,1.4,"F");
  pdfMarca(doc,ML,16,17);
  sf(doc,"semi"); doc.setFontSize(8.2); doc.setTextColor(...PC.sageL); doc.text(String(titulo).toUpperCase(),PW-ML,13,{align:"right",charSpace:0.5});
  if(sub){ sf(doc,"normal"); doc.setFontSize(8.5); doc.setTextColor(190,196,189); doc.text(sub,PW-ML,19,{align:"right"}); }
  doc._st.y=48;
}
function pdfMini(doc,texto){
  doc.setFillColor(...PC.bar); doc.rect(0,0,PW,11,"F");
  pdfMarca(doc,ML,7.4,9);
  sf(doc,"normal"); doc.setFontSize(8); doc.setTextColor(190,196,189); doc.text(texto||"",PW-ML,7.2,{align:"right"});
}
function pdfPrecisa(doc,h,mini){
  const st=doc._st;
  if(st.y+h>PH-20){ doc.addPage(); doc._drawn.add(doc.internal.getNumberOfPages()); pdfMini(doc,mini||doc._mini); st.y=20; }
}
function pdfSecao(doc,titulo,cor,sub){
  pdfPrecisa(doc,22);
  const st=doc._st;
  doc.setFillColor(...cor); doc.roundedRect(ML,st.y-5.2,1.3,6.4,0.6,0.6,"F");
  sf(doc,"serif"); doc.setFontSize(15); doc.setTextColor(...PC.ink); doc.text(titulo,ML+4.2,st.y);
  if(sub){ sf(doc,"normal"); doc.setFontSize(8.3); doc.setTextColor(...PC.mut); doc.text(sub,PW-ML,st.y,{align:"right"}); }
  st.y+=6;
}
function pdfTabela(doc,opts,cor){
  const st=doc._st;
  doc.autoTable({
    startY:st.y, margin:{left:ML,right:ML,top:18,bottom:20}, theme:"plain",
    styles:{font:(doc._fn?doc._fn.sans:"helvetica"),fontSize:8.8,cellPadding:{top:2.1,bottom:2.1,left:2.4,right:2.4},textColor:PC.ink,lineColor:PC.line,lineWidth:0,overflow:"linebreak"},
    headStyles:{fillColor:cor,textColor:PC.white,fontStyle:"bold",fontSize:8.5},

    alternateRowStyles:{fillColor:PC.soft},
    didDrawPage:()=>{ const n=doc.internal.getCurrentPageInfo().pageNumber; if(!doc._drawn.has(n)){ doc._drawn.add(n); pdfMini(doc,doc._mini); } },
    ...opts
  });

}
function pdfKpis(doc,arr){

function pdfRodape(doc,esq){

    doc.text("Página "+i+" de "+n,PW-ML,PH-8,{align:"right"});
